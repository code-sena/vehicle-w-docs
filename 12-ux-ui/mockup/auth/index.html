<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavado Vehicular · Vista previa del módulo auth</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/base.css">

<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
  }
  .index-card {
    max-width: 420px;
    width: 100%;
    margin: 24px;
    padding: 40px;
    border-radius: 26px;
    background: var(--auth-card);
    border: 1px solid var(--border);
    box-shadow: 0 8px 30px rgba(0, 0, 0, .06);
    text-align: center;
  }
  .index-card h1 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .index-card p {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 26px;
    line-height: 1.6;
  }
  .index-links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .index-links a {
    display: block;
    padding: 14px 18px;
    border-radius: 12px;
    background: var(--primary);
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
  }
  .index-links a.secondary {
    background: var(--bg-soft);
    color: var(--text);
    border: 1.5px solid var(--border);
  }
</style>
</head>
<body>

  <div class="index-card">
    <h1>Lavado Vehicular — Módulo Auth</h1>
    <p>Reconstrucción fiel a tu proyecto real: landing + módulo auth, mismos colores, mismos componentes, mismos textos e imágenes.</p>

    <div class="index-links">
      <a href="landing.html">Landing</a>
      <a href="login.html" class="secondary">Iniciar Sesión</a>
      <a href="register.html" class="secondary">Crear Cuenta</a>
      <a href="forgot-password.html" class="secondary">Recuperar Contraseña</a>
    </div>
  </div>

</body>
</html>
