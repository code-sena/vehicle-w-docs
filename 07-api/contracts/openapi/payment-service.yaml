      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentDto"
          headers:
            Location:
              description: URL of the created resource
              schema:
                type: string
        "400":
          description: "Bad Request. `code`: `INVALID_LOYALTY_BALANCE`, `INVALID_LOYALTY_BOOKING`, `INVALID_LOYALTY_CUSTOMER`, `INVALID_LOYALTY_DESCRIPTION`, `INVALID_LOYALTY_POINTS`, `INVALID_PAYMENT_ACCOUNT`, `INVALID_PAYMENT_AMOUNT`, `INVALID_PAYMENT_BOOKING`, `INVALID_PAYMENT_STATUS_TRANSITION`, `INVALID_RECEIPT_FILE`, `INVALID_RECEIPT_UPLOADER`, `INVALID_REPORTED_AMOUNT`, `INVALID_REVIEWER`, `INVALID_TRANSACTION_REFERENCE`, `LOYALTY_INSUFFICIENT_BALANCE`, `PAYMENT_RECEIPT_REQUIRED`, `VALIDATION_ERROR`. Also the automatic `[ApiController]` validation (malformed JSON or a missing non-nullable field): `ValidationProblemDetails` with `errors` and `code` `VALIDATION_ERROR` (`AddValidationErrorCode`, BIZ-13)."
          content:
