      description: "XML doc: Pago recibido en el lavadero: queda aprobado con lo que falta por pagar de la reserva."
      x-access: roles
      x-roles:
        - ADMIN
      x-source: src/PaymentService.Api/Controllers/AdminPaymentsController.cs
      requestBody:
        required: true
