# Contract of payment-service, rebuilt on 2026-10-24 (internal route of the payment at booking added on 2026-10-26) from the code on origin/develop (see 07-api/README.md).
# Regenerate it from the code instead of editing by hand, so it never drifts.
openapi: 3.0.3
info:
  title: LavaRápido payment-service API
  version: v1
  description: |-
    Contract of payment-service (.NET 8, ADR-013), rebuilt from the controllers and minimal endpoints of `lavarapido-payment-service` on `origin/develop` (`d94cde5`, 2026-10-26) and checked against them (`07-api/README.md`). JSON is camelCase (System.Text.Json defaults); the error codes of each action were traced from the controller through the use cases, domain and adapters.

    **Security.** `[Authorize]` = any valid bearer token; `x-roles` = `[Authorize(Roles = …)]`. The roles come from the JWT `roles` claim. `security: []` = public. Since 2026-10-26 the `/internal/**` routes use the scheme `internalKey` (`InternalApiKeyAuthenticationHandler`): header `X-Internal-Key` equal to `INTERNAL_API_KEY`, compared in constant time; a missing or wrong key, or an unset `INTERNAL_API_KEY`, answers 401, and a user JWT is never accepted there. The gateway does not route them.

    **Errors.** Errors raised by the code are `ProblemDetail` with `code` (`GlobalExceptionHandler`): `DomainException` and `InvalidRequestException` 400, `NotFoundException` 404, `ConflictException` 409, `ServiceUnavailableException` 503. The automatic `[ApiController]` validation answers 400 `ValidationProblemDetails` with `errors` and `code` `VALIDATION_ERROR` (BIZ-13), and the JWT middleware answers 401/403 with an empty body. Catalogue (`ErrorCodes` and `DomainErrorCodes`):

    | `code` | HTTP | Raised by / when |
    |---|---|---|
    | `INVALID_ACCOUNT_HOLDER` | 400 | `DomainException` — `POST /api/v1/admin/payment-accounts`, `PUT /api/v1/admin/payment-accounts/{id}` |
    | `INVALID_ACCOUNT_INSTRUCTIONS` | 400 | `DomainException` — `POST /api/v1/admin/payment-accounts`, `PUT /api/v1/admin/payment-accounts/{id}` |
    | `INVALID_ACCOUNT_NUMBER` | 400 | `DomainException` — `POST /api/v1/admin/payment-accounts`, `PUT /api/v1/admin/payment-accounts/{id}` |
    | `INVALID_DATE_RANGE` | 400 | `InvalidRequestException` — `GET /api/v1/payments/me` |
    | `INVALID_DISCOUNT_TYPE` | 400 | `DomainException` — not returned by any endpoint |
    | `INVALID_LOYALTY_BALANCE` | 400 | `DomainException` — 6 operations (see `x-codes`) |
    | `INVALID_LOYALTY_BOOKING` | 400 | `DomainException` — `POST /api/v1/admin/payments`, `POST /api/v1/admin/payments/{id}/approve`, `POST /api/v1/admin/payments/{id}/refund` |
    | `INVALID_LOYALTY_CUSTOMER` | 400 | `DomainException` — `POST /api/v1/admin/payments`, `POST /api/v1/admin/payments/{id}/approve`, `POST /api/v1/admin/payments/{id}/refund` |
    | `INVALID_LOYALTY_DESCRIPTION` | 400 | `DomainException` — `POST /api/v1/admin/payments`, `POST /api/v1/admin/payments/{id}/approve`, `POST /api/v1/admin/payments/{id}/refund` |
    | `INVALID_LOYALTY_POINTS` | 400 | `DomainException` — `POST /api/v1/admin/payments`, `POST /api/v1/admin/payments/{id}/approve`, `POST /api/v1/admin/payments/{id}/refund` |
    | `INVALID_PAYMENT_ACCOUNT` | 400 | `DomainException` — `POST /api/v1/admin/payments`, `POST /api/v1/payments` |
    | `INVALID_PAYMENT_AMOUNT` | 400 | `DomainException` — `POST /api/v1/admin/payments`, `POST /api/v1/payments` |
    | `INVALID_PAYMENT_BOOKING` | 400 | `DomainException` — `POST /api/v1/admin/payments`, `POST /api/v1/payments` |
    | `INVALID_PAYMENT_METHOD` | 400 | `InvalidRequestException` — `POST /api/v1/admin/payment-accounts`, `PUT /api/v1/admin/payment-accounts/{id}` |
    | `INVALID_PAYMENT_STATUS` | 400 | `DomainException` — `GET /api/v1/admin/payments` |
    | `INVALID_PAYMENT_STATUS_TRANSITION` | 400 | `DomainException` — 5 operations (see `x-codes`) |
    | `INVALID_PROMOTION_BENEFITS` | 400 | `DomainException` — `POST /api/v1/admin/promotions`, `PUT /api/v1/admin/promotions/{id}` |
    | `INVALID_PROMOTION_CODE` | 400 | `DomainException` — `POST /api/v1/admin/promotions`, `PUT /api/v1/admin/promotions/{id}` |
    | `INVALID_PROMOTION_DESCRIPTION` | 400 | `DomainException` — `POST /api/v1/admin/promotions`, `PUT /api/v1/admin/promotions/{id}` |
    | `INVALID_PROMOTION_DISCOUNT` | 400 | `DomainException` — `POST /api/v1/admin/promotions`, `PUT /api/v1/admin/promotions/{id}` |
    | `INVALID_PROMOTION_DURATION` | 400 | `DomainException` — `POST /api/v1/admin/promotions`, `PUT /api/v1/admin/promotions/{id}` |
    | `INVALID_PROMOTION_ICON` | 400 | `DomainException` — `POST /api/v1/admin/promotions`, `PUT /api/v1/admin/promotions/{id}` |
    | `INVALID_PROMOTION_NAME` | 400 | `DomainException` — `POST /api/v1/admin/promotions`, `PUT /api/v1/admin/promotions/{id}` |
    | `INVALID_PROMOTION_PRICE` | 400 | `DomainException` — `POST /api/v1/admin/promotions`, `PUT /api/v1/admin/promotions/{id}` |
    | `INVALID_PROMOTION_RANGE` | 400 | `DomainException` — `POST /api/v1/admin/promotions`, `PUT /api/v1/admin/promotions/{id}` |
    | `INVALID_PROMOTION_REQUIRED_POINTS` | 400 | `DomainException` — `POST /api/v1/admin/promotions`, `PUT /api/v1/admin/promotions/{id}` |
    | `INVALID_QR_IMAGE` | 400 | `DomainException` — `POST /api/v1/admin/payment-accounts`, `PUT /api/v1/admin/payment-accounts/{id}` |
    | `INVALID_RECEIPT_FILE` | 400 | `DomainException` — `POST /api/v1/admin/payments`, `POST /api/v1/payments` |
    | `INVALID_RECEIPT_UPLOADER` | 400 | `DomainException` — `POST /api/v1/admin/payments`, `POST /api/v1/payments` |
    | `INVALID_REDEMPTION_BOOKING` | 400 | `DomainException` — `POST /api/v1/loyalty/redeem` |
    | `INVALID_REJECTION_REASON` | 400 | `DomainException` — `POST /api/v1/admin/payments/{id}/reject` |
    | `INVALID_REPORTED_AMOUNT` | 400 | `DomainException` — `POST /api/v1/admin/payments`, `POST /api/v1/payments` |
    | `INVALID_REVIEW_COMMENT` | 400 | `DomainException` — not returned by any endpoint |
    | `INVALID_REVIEWER` | 400 | `DomainException` — `POST /api/v1/admin/payments`, `POST /api/v1/admin/payments/{id}/approve`, `POST /api/v1/admin/payments/{id}/reject` |
    | `INVALID_TRANSACTION_REFERENCE` | 400 | `DomainException` — `POST /api/v1/admin/payments`, `POST /api/v1/payments` |
    | `LOYALTY_INSUFFICIENT_BALANCE` | 400 | `DomainException` — `POST /api/v1/admin/payments`, `POST /api/v1/admin/payments/{id}/approve`, `POST /api/v1/admin/payments/{id}/refund` |
    | `PAYMENT_RECEIPT_REQUIRED` | 400 | `DomainException` — `POST /api/v1/admin/payments`, `POST /api/v1/payments` |
    | `PROMOTION_ALREADY_REDEEMED` | 400 | `DomainException` — `POST /api/v1/loyalty/redeem` |
    | `PROMOTION_CUSTOMER_LIMIT_REACHED` | 400 | `DomainException` — `POST /api/v1/loyalty/redeem` |
    | `PROMOTION_DISCOUNT_UNSUPPORTED` | 400 | `DomainException` — not returned by any endpoint |
    | `PROMOTION_EXHAUSTED` | 400 | `DomainException` — `POST /api/v1/loyalty/redeem` |
    | `PROMOTION_MIN_PURCHASE_NOT_MET` | 400 | `DomainException` — `POST /api/v1/loyalty/redeem` |
    | `PROMOTION_NOT_REDEEMABLE` | 400 | `DomainException` — `POST /api/v1/loyalty/redeem` |
    | `PROMOTION_NOTHING_TO_DISCOUNT` | 400 | `DomainException` — `POST /api/v1/loyalty/redeem` |
    | `PROMOTION_ONE_PER_BOOKING` | 400 | `DomainException` — `POST /api/v1/loyalty/redeem` |
    | `RECEIPT_TOO_LARGE` | 400 | `DomainException` — `POST /api/v1/payments` |
    | `VALIDATION_ERROR` | 400 | `[ApiController]` automatic validation (`AddValidationErrorCode`): malformed JSON or a missing `[JsonRequired]`/non-nullable field — 9 operations with a body (see `x-codes`) |
    | `UNAUTHORIZED` | 401 | Token without a valid numeric `sub` (`UnauthorizedAccessException`). A missing or invalid token gets an empty 401 from the JWT middleware |
    | `BOOKING_NOT_FOUND` | 404 | `NotFoundException` — 7 operations (see `x-codes`) |
    | `PAYMENT_ACCOUNT_NOT_FOUND` | 404 | `NotFoundException` — `PUT /api/v1/admin/payment-accounts/{id}` |
    | `PAYMENT_NOT_FOUND` | 404 | `NotFoundException` — 5 operations (see `x-codes`) |
    | `PROMOTION_NOT_FOUND` | 404 | `NotFoundException` — 4 operations (see `x-codes`) |
    | `PROMOTION_REDEMPTION_NOT_FOUND` | 404 | `NotFoundException` — `DELETE /api/v1/loyalty/redemptions/{bookingId}/{promotionId}` |
    | `AMOUNT_CHANGED` | 409 | `ConflictException` — `POST /api/v1/admin/payments/{id}/approve` |
    | `BOOKING_NOT_PAYABLE` | 409 | `ConflictException` — 5 operations (see `x-codes`) |
    | `DATA_CONFLICT` | 409 | `ConflictException` — 13 operations (see `x-codes`) |
    | `PAYMENT_ALREADY_APPROVED` | 409 | `ConflictException` — 5 operations (see `x-codes`) |
    | `PAYMENT_ALREADY_REPORTED` | 409 | `ConflictException` — 4 operations (see `x-codes`) |
    | `PROMOTION_CODE_TAKEN` | 409 | `ConflictException` — `POST /api/v1/admin/promotions`, `PUT /api/v1/admin/promotions/{id}` |
    | `TRANSACTION_REFERENCE_REUSED` | 409 | `ConflictException` — `POST /api/v1/admin/payments`, `POST /api/v1/payments` |
    | `BOOKING_SERVICE_UNAVAILABLE` | 503 | `ServiceUnavailableException` — 14 operations (see `x-codes`) |
