            schema:
              $ref: "#/components/schemas/SaveAccountRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentAccountDto"
          headers:
            Location:
              description: URL of the created resource
              schema:
                type: string
        "400":
          description: "Bad Request. `code`: `INVALID_ACCOUNT_HOLDER`, `INVALID_ACCOUNT_INSTRUCTIONS`, `INVALID_ACCOUNT_NUMBER`, `INVALID_PAYMENT_METHOD`, `INVALID_QR_IMAGE`, `VALIDATION_ERROR`. Also the automatic `[ApiController]` validation (malformed JSON or a missing non-nullable field): `ValidationProblemDetails` with `errors` and `code` `VALIDATION_ERROR` (`AddValidationErrorCode`, BIZ-13)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          x-codes:
            - INVALID_ACCOUNT_HOLDER
            - INVALID_ACCOUNT_INSTRUCTIONS
            - INVALID_ACCOUNT_NUMBER
            - INVALID_PAYMENT_METHOD
            - INVALID_QR_IMAGE
            - VALIDATION_ERROR
        "401":
          description: "Unauthorized. Without a valid bearer token ASP.NET answers 401 with an empty body and `WWW-Authenticate: Bearer`; a token without a numeric `sub` answers the ProblemDetail `UNAUTHORIZED`."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Forbidden. Token without the required role: empty body."
        "409":
