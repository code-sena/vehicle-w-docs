  /api/v1/admin/payments:
    get:
      tags:
        - Admin Payments
      operationId: list
      description: "XML doc: Cola de pagos, los más recientes primero, opcionalmente filtrada por estado (PENDING, IN_REVIEW, APPROVED, REJECTED, REFUNDED). E-10: con page o size responde una página {items, page, size, totalElements, totalPages} (page desde 0; size de 1 a 100, 20 por defecto) sin la imagen del comprobante: hasReceiptImage dice si tiene y la imagen se pide con GET /admin/payments/{id}. Sin page ni size responde el arreglo de siempre (hasta 200 pagos, con imagen) para que la web y la app actuales no cambien."
      x-access: roles
      x-roles:
        - ADMIN
      x-source: src/PaymentService.Api/Controllers/AdminPaymentsController.cs
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
          description: 0-based page; a negative value is read as 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            format: int32
          description: Page size, clamped to 1–100; 20 when only `page` is sent
      responses:
        "200":
          description: "OK. Without `page` and `size`: the array of the latest 200 payments, with the receipt image (`receiptImage`). With either of them: a page (`PaymentDtoPage`) without the image (`hasReceiptImage` says whether there is one; `GET /api/v1/admin/payments/{id}` returns it)."
          content:
            application/json:
              schema:
                oneOf:
