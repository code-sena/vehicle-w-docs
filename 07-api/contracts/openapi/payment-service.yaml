        - bookingTotal
        - appliedDiscounts
        - amountDue
      description: "Lo que falta por pagar de una reserva: su total, lo ya descontado por cupones y la diferencia, que es exactamente el monto con el que se registra el pago."
      x-dotnet: src/PaymentService.Application/Payments/PaymentContracts.cs:51
    AppliedRedemptionDto:
