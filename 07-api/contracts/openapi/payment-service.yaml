components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /api/v1/auth/login` (security-service, HS256, claims `sub`, `roles`, `sid`). Every service validates it itself (ADR-006); the gateway forwards it unchanged.
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: Shared key between services (`INTERNAL_API_KEY`, `InternalApiKeyAuthenticationHandler`, 2026-10-26). Only for `/internal/**`; these routes are not published by the API gateway.
  schemas:
    ProblemDetail:
      type: object
      description: "RFC 7807 problem detail of `GlobalExceptionHandler` (`application/problem+json`): `code` is the stable value the web and the app translate; `detail` is a Spanish message."
      required:
        - status
        - code
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: The data conflicts with an existing record
        instance:
          type: string
          example: /api/v1/bookings
        code:
          type: string
          description: Error code (catalogue in `info.description` and `x-error-codes`)
          example: CONFLICT
      additionalProperties: true
    AmountDueDto:
      type: object
      properties:
        bookingId:
          type: integer
          format: int64
        bookingTotal:
          type: number
          format: double
        appliedDiscounts:
          type: number
          format: double
        amountDue:
          type: number
          format: double
      required:
