paths:
  /actuator/health:
    get:
      tags:
        - Health
      operationId: actuatorHealth
      security: []
      x-access: public
      x-source: src/PaymentService.Api/Configuration/HealthEndpoints.cs
      responses:
        "200":
          description: Up (`{"status":"UP"}` or `{"service":"payment-service","status":"ok"}`)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: SQL Server does not answer within 3 s (`DOWN` / `down`)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/admin/payment-accounts:
