# Contract of security-service, rebuilt on 2026-10-23 from the code on origin/develop (see 07-api/README.md).
# Regenerate it from the code instead of editing by hand, so it never drifts.
openapi: 3.0.3
info:
  title: LavaRápido security-service API
  version: v1
  description: |-
    Contract of security-service, rebuilt from the controllers of `security-service` on `origin/develop` (`113fc4d`, 2026-10-23) and checked against them (`07-api/README.md`, "How the contracts are checked"). Paths, methods, parameters, bodies, success codes and roles are the ones in the code; the error codes of each operation were traced from the controller method through the use cases, domain and adapters it calls.

    **Security.** Operations without `security` use the bearer JWT (`bearerAuth`). `security: []` = public. `x-roles` = roles the service accepts on that path (from its `SecurityConfig`); `x-access` = `public`, `authenticated` (any role), `roles`, `internal` (only `X-Internal-Key`, not published by the gateway) or `roles + internal key`. Ownership checks (a client only sees its own data) answer 404, not 403.

    **Errors.** Every error is a `ProblemDetail` with `code`. Each error response lists its codes in `x-codes`. Catalogue of this service:

    | `code` | HTTP | Raised by / when |
    |---|---|---|
    | `BAD_REQUEST` | 400 | Spring MVC rejected the request before the controller: malformed JSON, missing required query parameter or wrong parameter type |
    | `EMAIL_DOMAIN_NOT_ALLOWED` | 400 | `InvalidValueException` — `POST /api/v1/auth/register`, `POST /api/v1/admin/users`, `PUT /api/v1/users/me/email` |
    | `INCORRECT_CURRENT_PASSWORD` | 400 | `IncorrectCurrentPasswordException` — `PUT /api/v1/users/me/password`, `PUT /api/v1/users/me/email`, `POST /api/v1/users/me/deactivate` |
    | `INVALID_ADDRESS` | 400 | `InvalidValueException` — `PUT /api/v1/users/me/address` |
    | `INVALID_DOCUMENT` | 400 | `InvalidValueException` — 17 operations (see `x-codes` of each response) |
    | `INVALID_EMAIL` | 400 | `InvalidValueException` — 17 operations (see `x-codes` of each response) |
    | `INVALID_LANGUAGE` | 400 | `InvalidValueException` — `GET /internal/v1/users/{userId}/contact`, `GET /api/v1/users/me/preferences`, `PUT /api/v1/users/me/preferences` |
    | `INVALID_NAME` | 400 | `InvalidValueException` — 17 operations (see `x-codes` of each response) |
    | `INVALID_PHONE` | 400 | `InvalidValueException` — 17 operations (see `x-codes` of each response) |
    | `INVALID_RESET_CODE` | 400 | `InvalidResetCodeException` — `POST /api/v1/auth/password/verify`, `POST /api/v1/auth/password/reset` |
    | `INVALID_ROLES` | 400 | `InvalidValueException` — `POST /api/v1/admin/users` |
    | `INVALID_THEME` | 400 | `InvalidValueException` — `GET /internal/v1/users/{userId}/contact`, `GET /api/v1/users/me/preferences`, `PUT /api/v1/users/me/preferences` |
    | `SAME_PASSWORD` | 400 | `SamePasswordException` — `POST /api/v1/auth/password/reset`, `PUT /api/v1/users/me/password` |
    | `UNKNOWN_PERMISSION` | 400 | `UnknownPermissionException` — `PUT /api/v1/admin/roles-permissions/{role}` |
    | `VALIDATION_ERROR` | 400 | Bean Validation failed on the body (`errors`: field → message) or, where the service maps it, a path/query parameter has the wrong type |
    | `WEAK_PASSWORD` | 400 | `WeakPasswordException` — 4 operations (see `x-codes` of each response) |
    | `INVALID_CREDENTIALS` | 401 | `InvalidCredentialsException` — `POST /api/v1/auth/login` |
    | `UNAUTHORIZED` | 401 | No `Authorization: Bearer` token, invalid or expired token, closed session (the gateway checks it), or missing/wrong `X-Internal-Key` on `/internal/**` |
    | `ACCOUNT_DISABLED` | 403 | `AccountDisabledException` — `POST /api/v1/auth/login` |
    | `ADMIN_CANNOT_BE_DISABLED` | 403 | `AdminAccountCannotBeDisabledException` — `PATCH /api/v1/admin/users/{userId}/status` |
    | `CANNOT_DISABLE_OWN_ACCOUNT` | 403 | `CannotDisableOwnAccountException` — `PATCH /api/v1/admin/users/{userId}/status`, `POST /api/v1/users/me/deactivate` |
    | `FORBIDDEN` | 403 | The token is valid but its role is not allowed on this path |
    | `NOT_FOUND` | 404 | No route matches (Spring MVC) |
    | `USER_NOT_FOUND` | 404 | `UserNotFoundException` — not reached from HTTP (events or scheduled jobs) |
    | `METHOD_NOT_ALLOWED` | 405 | The path exists but not with this HTTP method |
    | `CONFLICT` | 409 | The database rejected the change (unique index, trigger or check) after the code's own checks |
    | `DOCUMENT_ALREADY_REGISTERED` | 409 | `DocumentAlreadyRegisteredException` — `POST /api/v1/auth/register`, `POST /api/v1/admin/users` |
    | `EMAIL_ALREADY_REGISTERED` | 409 | `EmailAlreadyRegisteredException` — `POST /api/v1/auth/register`, `POST /api/v1/admin/users`, `PUT /api/v1/users/me/email` |
    | `ACCOUNT_LOCKED` | 423 | `AccountLockedException` — `POST /api/v1/auth/login` |
    | `INTERNAL_ERROR` | 500 | Unexpected error (logged with its correlation id) |
servers:
  - url: http://localhost:8080
    description: Through the API gateway (ADR-005); `/internal/**` is not reachable here
  - url: http://localhost:3001
    description: security-service directly (local development and service-to-service calls)
security:
  - bearerAuth: []
tags:
