  - name: Admin - roles y permisos
    description: Permisos de los 3 roles fijos (solo ADMIN)
  - name: User Address
  - name: Admin - users
    description: Gestión de cuentas (solo ADMIN)
  - name: My account
    description: Perfil, contraseña y preferencias del usuario con sesión
