components:
  schemas:
    PreferencesRequest:
      type: "object"
      properties:
        theme:
          type: "string"
        language:
          type: "string"
        notificationsEnabled:
          type: "boolean"
        emailRemindersEnabled:
          type: "boolean"
        promotionsEnabled:
          type: "boolean"
    PreferencesResponse:
      type: "object"
      properties:
        theme:
          type: "string"
        language:
          type: "string"
        notificationsEnabled:
          type: "boolean"
        emailRemindersEnabled:
          type: "boolean"
        promotionsEnabled:
          type: "boolean"
    ChangePasswordRequest:
      type: "object"
      properties:
        currentPassword:
          type: "string"
          maxLength: 72
          minLength: 0
        newPassword:
          type: "string"
          maxLength: 72
          minLength: 0
      required:
        - "currentPassword"
        - "newPassword"
    ChangeEmailRequest:
      type: "object"
      properties:
        newEmail:
          type: "string"
          format: "email"
          maxLength: 60
          minLength: 0
        currentPassword:
          type: "string"
          maxLength: 72
          minLength: 0
      required:
        - "currentPassword"
        - "newEmail"
    UserResponse:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        email:
          type: "string"
        documentNumber:
          type: "string"
        firstName:
          type: "string"
        lastName:
          type: "string"
        phone:
          type: "string"
        roles:
          type: "array"
          items:
            type: "string"
        active:
          type: "boolean"
        lastLogin:
          type: "string"
          format: "date-time"
        personId:
          type: "integer"
          format: "int64"
        createdAt:
          type: "string"
          format: "date-time"
    AddressDto:
      type: "object"
      properties:
        address:
          type: "string"
          maxLength: 200
          minLength: 0
    UpdateRolePermissionsRequest:
      type: "object"
      properties:
        permissionIds:
          type: "array"
          items:
            type: "integer"
            format: "int32"
      required:
        - "permissionIds"
    RolePermissionsResponse:
      type: "object"
      properties:
        role:
          type: "string"
        permissionIds:
          type: "array"
          items:
            type: "integer"
            format: "int32"
    DeactivateAccountRequest:
      type: "object"
      properties:
        currentPassword:
          type: "string"
          maxLength: 72
          minLength: 0
      required:
        - "currentPassword"
    RegisterRequest:
      type: "object"
      properties:
        documentNumber:
          type: "string"
          maxLength: 20
          minLength: 0
        firstName:
          type: "string"
          maxLength: 60
          minLength: 0
        lastName:
          type: "string"
          maxLength: 60
          minLength: 0
        email:
          type: "string"
          format: "email"
          maxLength: 60
          minLength: 0
        phone:
          type: "string"
          maxLength: 20
          minLength: 0
        password:
          type: "string"
          maxLength: 72
          minLength: 0
        acceptsTerms:
          type: "boolean"
        acceptsDataPolicy:
          type: "boolean"
      required:
        - "documentNumber"
        - "email"
        - "firstName"
        - "lastName"
        - "password"
    VerifyResetCodeRequest:
      type: "object"
      properties:
        email:
          type: "string"
          maxLength: 120
          minLength: 0
        code:
          type: "string"
          minLength: 1
          pattern: "[0-9]{6}"
      required:
        - "code"
        - "email"
    ResetPasswordRequest:
      type: "object"
      properties:
        email:
          type: "string"
          maxLength: 120
          minLength: 0
        code:
          type: "string"
          minLength: 1
          pattern: "[0-9]{6}"
        newPassword:
          type: "string"
          maxLength: 72
          minLength: 0
      required:
        - "code"
        - "email"
        - "newPassword"
    ForgotPasswordRequest:
      type: "object"
      properties:
        email:
          type: "string"
          maxLength: 120
          minLength: 0
      required:
        - "email"
    LoginRequest:
      type: "object"
      properties:
        email:
          type: "string"
          maxLength: 120
          minLength: 0
        password:
          type: "string"
          maxLength: 72
          minLength: 0
      required:
        - "email"
        - "password"
    LoginResponse:
      type: "object"
      properties:
        accessToken:
          type: "string"
        tokenType:
          type: "string"
        expiresIn:
          type: "integer"
          format: "int64"
        expiresAt:
          type: "string"
          format: "date-time"
        user:
          "$ref": "#/components/schemas/UserResponse"
    CreateUserRequest:
      type: "object"
      properties:
        documentNumber:
          type: "string"
          maxLength: 20
          minLength: 0
        firstName:
          type: "string"
          maxLength: 60
          minLength: 0
        lastName:
          type: "string"
          maxLength: 60
          minLength: 0
        email:
          type: "string"
          format: "email"
          maxLength: 60
          minLength: 0
        phone:
          type: "string"
          maxLength: 20
          minLength: 0
        password:
          type: "string"
          maxLength: 72
          minLength: 0
        roles:
          type: "array"
          items:
            type: "string"
            enum:
              - "ADMIN"
              - "OPERATOR"
              - "CLIENT"
          minItems: 1
          uniqueItems: true
      required:
        - "documentNumber"
        - "email"
        - "firstName"
        - "lastName"
        - "password"
        - "roles"
    UpdateProfileRequest:
      type: "object"
      properties:
        firstName:
          type: "string"
          maxLength: 60
          minLength: 0
        lastName:
          type: "string"
          maxLength: 60
          minLength: 0
        phone:
          type: "string"
          maxLength: 20
          minLength: 0
      required:
        - "firstName"
        - "lastName"
    UpdateStatusRequest:
      type: "object"
      properties:
        active:
          type: "boolean"
      required:
        - "active"
    UpdateRoleRequest:
      type: "object"
      properties:
        role:
          type: "string"
          enum:
            - "ADMIN"
            - "OPERATOR"
            - "CLIENT"
      required:
        - "role"
    ContactResponse:
      type: "object"
      properties:
        userId:
          type: "integer"
          format: "int64"
        email:
          type: "string"
        firstName:
          type: "string"
        active:
          type: "boolean"
        pushEnabled:
          type: "boolean"
        emailRemindersEnabled:
          type: "boolean"
        promotionsEnabled:
          type: "boolean"
        language:
          type: "string"
    PageResponseUserResponse:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/UserResponse"
        page:
          type: "integer"
          format: "int32"
        size:
          type: "integer"
          format: "int32"
        totalElements:
          type: "integer"
          format: "int64"
        totalPages:
          type: "integer"
          format: "int32"
    PermissionResponse:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        code:
          type: "string"
        name:
          type: "string"
        resource:
          type: "string"
        action:
          type: "string"
    RolePermissionsMatrixResponse:
      type: "object"
      properties:
        permissions:
          type: "array"
          items:
            "$ref": "#/components/schemas/PermissionResponse"
        roles:
          type: "array"
          items:
            "$ref": "#/components/schemas/RolePermissionsResponse"
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
