components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /api/v1/auth/login` (security-service, HS256, claims `sub`, `roles`, `sid`). Every service validates it itself (ADR-006); the gateway forwards it unchanged.
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: Shared key between services (`app.internal.api-key` / `INTERNAL_API_KEY`). Only for `/internal/**` (and, in booking-service, `/api/v1/operator/**`). These routes are not published by the API gateway.
  schemas:
    ProblemDetail:
      type: object
      description: "RFC 7807 problem detail returned by every error (`Content-Type: application/problem+json`). `code` is the stable value the web and the app translate; `detail` is an English message for logs."
      required:
        - status
        - code
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: The data conflicts with an existing record
        instance:
          type: string
          example: /api/v1/bookings
        code:
          type: string
          description: Error code (catalogue in `info.description` and `x-error-codes`)
          example: CONFLICT
        errors:
          type: object
          additionalProperties:
            type: string
          description: "Only with `VALIDATION_ERROR`: invalid field → message"
        violations:
          type: array
          items:
            type: string
          description: "Only with `WEAK_PASSWORD`: the password rules that failed"
      additionalProperties: true
    AddressDto:
      type: object
      properties:
        address:
          type: string
          maxLength: .nan
      description: Dirección del perfil, en la petición y en la respuesta. Vacía o null la borra.
      x-java: com/lavarapido/security/infrastructure/adapter/in/web/dto/AddressDto.java:7
