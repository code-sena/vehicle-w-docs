components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /api/v1/auth/login` (security-service, HS256, claims `sub`, `roles`, `sid`). Every service validates it itself (ADR-006); the gateway forwards it unchanged.
  schemas:
    ProblemDetail:
      type: object
      description: "RFC 7807 problem detail returned by every error (`Content-Type: application/problem+json`). `code` is the stable value the web and the app translate; `detail` is an English message for logs."
      required:
        - status
        - code
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: The data conflicts with an existing record
        instance:
          type: string
          example: /api/v1/bookings
        code:
          type: string
          description: Error code (catalogue in `info.description` and `x-error-codes`)
          example: CONFLICT
        errors:
          type: object
          additionalProperties:
            type: string
          description: "Only with `VALIDATION_ERROR`: invalid field → message"
      additionalProperties: true
    OwnedVehicleResponse:
      type: object
      properties:
        vehicle:
          $ref: "#/components/schemas/VehicleResponse"
        ownerUserId:
          type: integer
          format: int64
      description: Un vehiculo con el user_id de su dueño (solo administrador).
      x-java: com/lavarapido/customer/infrastructure/adapter/in/web/dto/OwnedVehicleResponse.java:6
    RegisterVehicleRequest:
      type: object
      properties:
        licensePlate:
          type: string
          minLength: 1
          x-not-blank: true
          maxLength: 10
        vehicleType:
          type: string
          minLength: 1
          x-not-blank: true
        brand:
          type: string
          maxLength: 50
        model:
          type: string
          maxLength: 50
        color:
          type: string
          maxLength: 30
      required:
        - licensePlate
        - vehicleType
      description: "Cuerpo de POST /api/v1/vehicles. Aqui solo se revisa lo que el bean validation puede: que no venga vacio y que no sea enorme. El formato de la placa lo decide LicensePlatePolicy."
      x-java: com/lavarapido/customer/infrastructure/adapter/in/web/dto/RegisterVehicleRequest.java:11
    UpdateVehicleRequest:
      type: object
      properties:
        licensePlate:
          type: string
          minLength: 1
          x-not-blank: true
          maxLength: 10
        vehicleType:
          type: string
          minLength: 1
          x-not-blank: true
        brand:
          type: string
          maxLength: 50
        model:
          type: string
          maxLength: 50
        color:
          type: string
          maxLength: 30
      required:
        - licensePlate
        - vehicleType
      description: Cuerpo de PUT /api/v1/vehicles/{id}. Es un PUT completo y no un PATCH porque el formulario de Angular manda los cuatro campos siempre, y un PUT deja claro que lo que no viene se borra. El id del vehiculo va en la ruta y el del cliente sale del token, ninguno de los dos viene aqui.
      x-java: com/lavarapido/customer/infrastructure/adapter/in/web/dto/UpdateVehicleRequest.java:14
    VehicleResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        licensePlate:
          type: string
        licensePlateFormatted:
          type: string
        vehicleType:
          type: string
        vehicleTypeId:
          type: integer
          format: int32
        vehicleTypeName:
          type: string
        brand:
          type: string
        model:
          type: string
        color:
          type: string
        createdAt:
          type: string
          format: date-time
      description: "Respuesta de un vehiculo. Van las dos formas de la placa: licensePlate como se guarda (ABC123) y licensePlateFormatted como se ve (ABC-123). El frontend arma el input por su cuenta, pero mandarle las dos evita que cada pantalla invente su propio formato."
      x-java: com/lavarapido/customer/infrastructure/adapter/in/web/dto/VehicleResponse.java:14
    VehicleTypeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        code:
          type: string
        name:
          type: string
        sizeFactor:
          type: number
        displayOrder:
          type: integer
          format: int32
      description: Respuesta de un tipo de vehiculo. Se manda sizeFactor porque el formulario de administracion lo necesita para sugerir el precio de una tarifa nueva, no para calcular cobros.
      x-java: com/lavarapido/customer/infrastructure/adapter/in/web/dto/VehicleTypeResponse.java:11
x-error-codes:
  BAD_REQUEST: 400
