      operationId: update
      x-access: authenticated
      x-source: com/lavarapido/customer/infrastructure/adapter/in/web/CustomerVehicleController.java:86
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVehicleRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleResponse"
        "400":
          description: "Bad Request. `code`: `BAD_REQUEST`, `INVALID_PERSON`, `INVALID_PLATE`, `INVALID_POINTS`, `INVALID_TOKEN`, `INVALID_VEHICLE_TEXT`, `INVALID_VEHICLE_TYPE`, `VALIDATION_ERROR`."
          x-codes:
            - BAD_REQUEST
            - INVALID_PERSON
            - INVALID_PLATE
            - INVALID_POINTS
            - INVALID_TOKEN
            - INVALID_VEHICLE_TEXT
