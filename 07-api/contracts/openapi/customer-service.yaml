        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleResponse"
        "400":
          description: "Bad Request. `code`: `BAD_REQUEST`, `INVALID_PERSON`, `INVALID_PLATE`, `INVALID_POINTS`, `INVALID_TOKEN`, `INVALID_VEHICLE_TEXT`, `INVALID_VEHICLE_TYPE`."
          x-codes:
            - BAD_REQUEST
            - INVALID_PERSON
            - INVALID_PLATE
            - INVALID_POINTS
            - INVALID_TOKEN
            - INVALID_VEHICLE_TEXT
            - INVALID_VEHICLE_TYPE
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "Unauthorized. `code`: `UNAUTHORIZED`."
          x-codes:
            - UNAUTHORIZED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: "Not Found. `code`: `VEHICLE_NOT_FOUND`."
          x-codes:
            - VEHICLE_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: "Conflict. `code`: `CUSTOMER_NOT_PROVISIONED`."
          x-codes:
            - CUSTOMER_NOT_PROVISIONED
          content:
            application/problem+json:
              schema:
