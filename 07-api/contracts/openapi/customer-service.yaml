                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "Unauthorized. `code`: `UNAUTHORIZED`."
          x-codes:
            - UNAUTHORIZED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
