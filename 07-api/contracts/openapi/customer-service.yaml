# Contract of customer-service, rebuilt on 2026-10-23 from the code on origin/develop (see 07-api/README.md).
# Regenerate it from the code instead of editing by hand, so it never drifts.
openapi: 3.0.3
info:
  title: LavaRápido customer-service API
  version: v1
  description: |-
    Contract of customer-service, rebuilt from the controllers of `lavarapido-customer-service` on `origin/develop` (`02cdb46`, 2026-10-23) and checked against them (`07-api/README.md`, "How the contracts are checked"). Paths, methods, parameters, bodies, success codes and roles are the ones in the code; the error codes of each operation were traced from the controller method through the use cases, domain and adapters it calls.

    **Security.** Operations without `security` use the bearer JWT (`bearerAuth`). `security: []` = public. `x-roles` = roles the service accepts on that path (from its `SecurityConfig`); `x-access` = `public`, `authenticated` (any role), `roles`, `internal` (only `X-Internal-Key`, not published by the gateway) or `roles + internal key`. Ownership checks (a client only sees its own data) answer 404, not 403.

    **Errors.** Every error is a `ProblemDetail` with `code`. Each error response lists its codes in `x-codes`. Catalogue of this service:

    | `code` | HTTP | Raised by / when |
    |---|---|---|
    | `BAD_REQUEST` | 400 | Spring MVC rejected the request before the controller: malformed JSON, missing required query parameter or wrong parameter type |
    | `INVALID_CUSTOMER` | 400 | `InvalidValueException` — `POST /api/v1/vehicles`, `DELETE /api/v1/vehicles/{id}` |
    | `INVALID_PERSON` | 400 | `InvalidValueException` — 5 operations (see `x-codes` of each response) |
    | `INVALID_PLATE` | 400 | `InvalidValueException` — 6 operations (see `x-codes` of each response) |
    | `INVALID_POINTS` | 400 | `InvalidValueException` — 6 operations (see `x-codes` of each response) |
    | `INVALID_TOKEN` | 400 | `InvalidValueException` — 5 operations (see `x-codes` of each response) |
    | `INVALID_VEHICLE_TEXT` | 400 | `InvalidValueException` — 6 operations (see `x-codes` of each response) |
    | `INVALID_VEHICLE_TYPE` | 400 | `InvalidValueException` — 7 operations (see `x-codes` of each response) |
    | `MISSING_FILTER` | 400 | `InvalidValueException` — `GET /api/v1/admin/vehicles` |
    | `TOO_MANY_IDS` | 400 | `InvalidValueException` — `GET /api/v1/admin/vehicles` |
    | `VALIDATION_ERROR` | 400 | Bean Validation failed on the body (`errors`: field → message) or, where the service maps it, a path/query parameter has the wrong type |
    | `UNAUTHORIZED` | 401 | No `Authorization: Bearer` token, invalid or expired token, closed session (the gateway checks it), or missing/wrong `X-Internal-Key` on `/internal/**` |
    | `FORBIDDEN` | 403 | The token is valid but its role is not allowed on this path |
    | `NOT_FOUND` | 404 | No route matches (Spring MVC) |
    | `VEHICLE_NOT_FOUND` | 404 | `VehicleNotFoundException` — 5 operations (see `x-codes` of each response) |
    | `METHOD_NOT_ALLOWED` | 405 | The path exists but not with this HTTP method |
    | `CONFLICT` | 409 | The database rejected the change (unique index, trigger or check) after the code's own checks |
    | `CUSTOMER_NOT_PROVISIONED` | 409 | `CustomerNotProvisionedException` — 5 operations (see `x-codes` of each response) |
    | `PLATE_ALREADY_REGISTERED` | 409 | `PlateAlreadyRegisteredException` — `POST /api/v1/vehicles`, `PUT /api/v1/vehicles/{id}`, `DELETE /api/v1/vehicles/{id}` |
    | `INTERNAL_ERROR` | 500 | Unexpected error (logged with its correlation id) |
servers:
  - url: http://localhost:8080
    description: Through the API gateway (ADR-005); `/internal/**` is not reachable here
  - url: http://localhost:3002
    description: customer-service directly (local development and service-to-service calls)
security:
  - bearerAuth: []
tags:
  - name: Admin Vehicle
  - name: Customer Vehicle
  - name: Vehicle Type
paths:
  /api/v1/admin/vehicles:
    get:
      tags:
        - Admin Vehicle
      operationId: find
      x-access: roles
      x-roles:
        - ADMIN
        - OPERATOR
      x-source: com/lavarapido/customer/infrastructure/adapter/in/web/AdminVehicleController.java:32
      parameters:
        - name: ids
          in: query
          required: false
          schema:
            type: array
            items:
              type: integer
              format: int64
          style: form
          explode: true
        - name: plate
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OwnedVehicleResponse"
        "400":
          description: "Bad Request. `code`: `BAD_REQUEST`, `INVALID_PLATE`, `INVALID_POINTS`, `INVALID_VEHICLE_TEXT`, `INVALID_VEHICLE_TYPE`, `MISSING_FILTER`, `TOO_MANY_IDS`."
          x-codes:
            - BAD_REQUEST
            - INVALID_PLATE
            - INVALID_POINTS
            - INVALID_VEHICLE_TEXT
            - INVALID_VEHICLE_TYPE
            - MISSING_FILTER
            - TOO_MANY_IDS
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "Unauthorized. `code`: `UNAUTHORIZED`."
          x-codes:
            - UNAUTHORIZED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: "Forbidden. `code`: `FORBIDDEN`."
          x-codes:
            - FORBIDDEN
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: "Not Found. `code`: `VEHICLE_NOT_FOUND`."
          x-codes:
            - VEHICLE_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
