          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
    post:
      tags:
        - Customer Vehicle
      operationId: register
      x-access: authenticated
      x-source: com/lavarapido/customer/infrastructure/adapter/in/web/CustomerVehicleController.java:75
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterVehicleRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleResponse"
          headers:
            Location:
              description: URL of the created resource
              schema:
                type: string
        "400":
          description: "Bad Request. `code`: `BAD_REQUEST`, `INVALID_CUSTOMER`, `INVALID_PERSON`, `INVALID_PLATE`, `INVALID_POINTS`, `INVALID_TOKEN`, `INVALID_VEHICLE_TEXT`, `INVALID_VEHICLE_TYPE`, `VALIDATION_ERROR`."
          x-codes:
            - BAD_REQUEST
            - INVALID_CUSTOMER
            - INVALID_PERSON
            - INVALID_PLATE
            - INVALID_POINTS
            - INVALID_TOKEN
            - INVALID_VEHICLE_TEXT
            - INVALID_VEHICLE_TYPE
            - VALIDATION_ERROR
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "Unauthorized. `code`: `UNAUTHORIZED`."
          x-codes:
            - UNAUTHORIZED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: "Not Found. `code`: `VEHICLE_NOT_FOUND`."
          x-codes:
            - VEHICLE_NOT_FOUND
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: "Conflict. `code`: `CUSTOMER_NOT_PROVISIONED`, `PLATE_ALREADY_REGISTERED`."
          x-codes:
            - CUSTOMER_NOT_PROVISIONED
            - PLATE_ALREADY_REGISTERED
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/vehicles/{id}:
