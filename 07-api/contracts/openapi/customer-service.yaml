          x-codes:
            - INVALID_PERSON
            - INVALID_PLATE
            - INVALID_POINTS
            - INVALID_TOKEN
            - INVALID_VEHICLE_TEXT
            - INVALID_VEHICLE_TYPE
          content:
            application/problem+json:
