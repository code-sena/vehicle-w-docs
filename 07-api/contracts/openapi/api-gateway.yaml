openapi: 3.0.3
info:
  title: LavaRápido API gateway
  version: v1
  description: |
    Single entry point of the system (ADR-005). The gateway has no business endpoints of its own:
    it forwards every `/api/v1/**` request unchanged to the service that owns the path, so the
    business contracts are the ones of each service:

    | Path | Contract |
    |---|---|
    | `/api/v1/auth/**`, `/api/v1/users/**`, `/api/v1/admin/users/**`, `/api/v1/admin/roles-permissions/**` | `security-service.yaml` |
    | `/api/v1/vehicles/**`, `/api/v1/vehicle-types/**`, `/api/v1/admin/vehicles/**` | `customer-service.yaml` |
    | `/api/v1/catalog/**`, `/api/v1/schedule/**`, `/api/v1/establishment`, `/api/v1/bookings/**`, `/api/v1/admin/bookings/**`, `/api/v1/admin/catalog/**`, `/api/v1/admin/schedule/**`, `/api/v1/admin/bays/**`, `/api/v1/admin/establishment`, `/api/v1/operator/bookings/**` | `booking-service.yaml` |
    | `/api/v1/operators/**`, `/api/v1/admin/operators/**`, `/api/v1/admin/assignments/**`, `/api/v1/admin/inspections/**`, `/api/v1/public/inspections/**`, `/api/v1/operator/services/**`, `/api/v1/operator/ratings`, `/api/v1/ratings/**` | `operations-service.yaml` |
    | `/api/v1/payments/**`, `/api/v1/payment-accounts`, `/api/v1/admin/payments/**`, `/api/v1/admin/payment-accounts/**`, `/api/v1/admin/payment-methods`, `/api/v1/admin/promotions/**`, `/api/v1/loyalty/**` | `payment-service.yaml` |
    | `/api/v1/notifications/**`, `/api/v1/admin/notifications/**` | `notification-service.yaml` |

    The JWT is validated by each service (ADR-006); the gateway forwards `Authorization`
    as is. CORS is answered by the gateway. `/internal/**` and any other path answer 404.
servers:
  - url: http://localhost:8080
    description: Local
paths:
  /actuator/health:
    get:
      summary: Gateway health
      operationId: health
      tags: [gateway]
      responses:
        "200":
          description: The gateway is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
