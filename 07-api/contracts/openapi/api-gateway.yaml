# Contract of api-gateway, rebuilt on 2026-10-24 from the code on origin/develop (see 07-api/README.md).
# Regenerate it from the code instead of editing by hand, so it never drifts.
openapi: 3.0.3
info:
  title: LavaRápido API gateway
  version: v1
  description: |-
    Single entry point (ADR-005), Spring Cloud Gateway Server MVC. Rebuilt from `src/main/resources/application.yml` of `lavarapido-api-gateway` on `origin/develop` (`c8b607a`, 2026-10-24). The gateway has no business endpoints: it forwards each request unchanged (path, `Authorization`, `X-Correlation-Id`) to the service whose `Path` predicate matches, so the business contracts are those of each service. Every route removes the CORS headers of the service (`RemoveResponseHeader`) because the gateway answers CORS itself (`CorsConfig`, `CORS_ALLOWED_ORIGINS`).

    **Routes** (in this order; the first matching predicate wins):

    | Route `id` | Target (`uri`) | `Path` predicates | Contract |
    |---|---|---|---|
    | `security-service` | `${ROUTE_SECURITY_URL:http://localhost:3001}` | `/api/v1/auth/**`, `/api/v1/users/**`, `/api/v1/admin/users/**`, `/api/v1/admin/users`, `/api/v1/admin/roles-permissions/**`, `/api/v1/admin/roles-permissions` | `security-service.yaml` |
    | `customer-service` | `${ROUTE_CUSTOMER_URL:http://localhost:3002}` | `/api/v1/vehicles/**`, `/api/v1/vehicles`, `/api/v1/vehicle-types/**`, `/api/v1/vehicle-types`, `/api/v1/admin/vehicles/**`, `/api/v1/admin/vehicles` | `customer-service.yaml` |
    | `booking-service` | `${ROUTE_BOOKING_URL:http://localhost:3003}` | `/api/v1/catalog/**`, `/api/v1/schedule/**`, `/api/v1/establishment`, `/api/v1/bookings/**`, `/api/v1/bookings`, `/api/v1/admin/bookings/**`, `/api/v1/admin/bookings`, `/api/v1/admin/catalog/**`, `/api/v1/admin/schedule/**`, `/api/v1/admin/bays/**`, `/api/v1/admin/bays`, `/api/v1/admin/establishment` | `booking-service.yaml` |
    | `operations-service` | `${ROUTE_OPERATIONS_URL:http://localhost:3004}` | `/api/v1/admin/operators/**`, `/api/v1/admin/operators`, `/api/v1/operators/**`, `/api/v1/admin/inspections/**`, `/api/v1/public/inspections/**`, `/api/v1/admin/assignments/**`, `/api/v1/admin/assignments`, `/api/v1/operator/services/**`, `/api/v1/operator/services`, `/api/v1/operator/ratings`, `/api/v1/ratings/**` | `operations-service.yaml` |
    | `payment-service` | `${ROUTE_PAYMENT_URL:http://localhost:3005}` | `/api/v1/payments/**`, `/api/v1/payments`, `/api/v1/payment-accounts`, `/api/v1/admin/payments/**`, `/api/v1/admin/payments`, `/api/v1/admin/payment-accounts/**`, `/api/v1/admin/payment-accounts`, `/api/v1/admin/payment-methods`, `/api/v1/admin/promotions/**`, `/api/v1/admin/promotions`, `/api/v1/loyalty/**`, `/api/v1/loyalty` | `payment-service.yaml` |
    | `notification-service` | `${ROUTE_NOTIFICATION_URL:http://localhost:3006}` | `/api/v1/notifications/**`, `/api/v1/notifications`, `/api/v1/admin/notifications/**`, `/api/v1/admin/notifications` | `notification-service.yaml` |

    **Not published.** Any path without a route answers 404 here. That includes every `/internal/**` route (service-to-service, `X-Internal-Key`) and, since E-01, `/api/v1/operator/bookings/**` of booking-service, which only operations-service calls with the internal key. The operator's own API is `/api/v1/operator/services/**` and `/api/v1/operator/ratings` (operations-service).

    **Session check** (`SessionCheckFilter`, `app.session-check.*`): for every request with a non-empty `Authorization` header, whatever its scheme or path (SEC-01; except `/api/v1/auth/**`, but including `/api/v1/auth/logout`), the gateway asks security-service `GET /api/v1/auth/session`. A 401 is returned to the client as is (its ProblemDetail, `code` `UNAUTHORIZED`); the answer is cached by SHA-256 of the token alone (`bearer`, `Bearer` and `BEARER` share it) for `SESSION_CHECK_CACHE_TTL` (30 s), and a logout clears it before and after forwarding; if security-service does not answer within `SESSION_CHECK_TIMEOUT` (3 s) the request goes on.

    **Rate limit** (`AuthRateLimitFilter`, SEC-04, `app.rate-limit.auth.*`): every request to `/api/v1/auth` or `/api/v1/auth/**` (except `OPTIONS`) takes a token from the bucket of its client IP: `AUTH_RATE_LIMIT_REQUESTS` (60) requests, refilled over `AUTH_RATE_LIMIT_WINDOW` (1 min). With the bucket empty the gateway answers **429** `application/problem+json` with `code` `RATE_LIMITED` and a `Retry-After` header (seconds) before reaching security-service. `AUTH_RATE_LIMIT_ENABLED=false` turns it off. The buckets live in memory: with several gateway replicas each one counts on its own.

    **Client IP** (`ClientIpResolver`, SEC-11): `X-Forwarded-For` is trusted only when the connection comes from `TRUSTED_PROXIES` (default loopback and the private Docker networks, where Caddy runs); otherwise the remote address is used. `ClientIpHeadersFilter` sends that IP to the services in `X-Forwarded-For`, never the value the client wrote.

    **Timeouts** (SEC-16, `spring.http.clients`): `ROUTE_CONNECT_TIMEOUT` (5 s) to connect to a service and `ROUTE_READ_TIMEOUT` (60 s) until its whole answer arrives (photo uploads included).
servers:
  - url: http://localhost:8080
    description: Local (`GATEWAY_PORT`)
paths:
  /actuator/health:
    get:
      tags:
        - gateway
      operationId: health
      security: []
      description: Spring Boot Actuator health of the gateway itself (with liveness/readiness probes).
      responses:
        "200":
          description: The gateway is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
  /actuator/info:
    get:
      tags:
        - gateway
      operationId: info
      security: []
      description: "Static info (`info.service: api-gateway`)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
x-routes:
  - id: security-service
    uri: ${ROUTE_SECURITY_URL:http://localhost:3001}
    predicates:
      - /api/v1/auth/**
      - /api/v1/users/**
      - /api/v1/admin/users/**
      - /api/v1/admin/users
      - /api/v1/admin/roles-permissions/**
      - /api/v1/admin/roles-permissions
    filters:
      - RemoveResponseHeader=Access-Control-Allow-Origin
      - RemoveResponseHeader=Access-Control-Allow-Credentials
      - RemoveResponseHeader=Access-Control-Expose-Headers
  - id: customer-service
    uri: ${ROUTE_CUSTOMER_URL:http://localhost:3002}
    predicates:
      - /api/v1/vehicles/**
      - /api/v1/vehicles
      - /api/v1/vehicle-types/**
      - /api/v1/vehicle-types
      - /api/v1/admin/vehicles/**
      - /api/v1/admin/vehicles
    filters:
      - RemoveResponseHeader=Access-Control-Allow-Origin
      - RemoveResponseHeader=Access-Control-Allow-Credentials
      - RemoveResponseHeader=Access-Control-Expose-Headers
  - id: booking-service
    uri: ${ROUTE_BOOKING_URL:http://localhost:3003}
    predicates:
      - /api/v1/catalog/**
      - /api/v1/schedule/**
      - /api/v1/establishment
      - /api/v1/bookings/**
      - /api/v1/bookings
      - /api/v1/admin/bookings/**
      - /api/v1/admin/bookings
      - /api/v1/admin/catalog/**
      - /api/v1/admin/schedule/**
      - /api/v1/admin/bays/**
      - /api/v1/admin/bays
      - /api/v1/admin/establishment
    filters:
      - RemoveResponseHeader=Access-Control-Allow-Origin
      - RemoveResponseHeader=Access-Control-Allow-Credentials
      - RemoveResponseHeader=Access-Control-Expose-Headers
  - id: operations-service
    uri: ${ROUTE_OPERATIONS_URL:http://localhost:3004}
    predicates:
      - /api/v1/admin/operators/**
      - /api/v1/admin/operators
      - /api/v1/operators/**
      - /api/v1/admin/inspections/**
      - /api/v1/public/inspections/**
      - /api/v1/admin/assignments/**
      - /api/v1/admin/assignments
      - /api/v1/operator/services/**
      - /api/v1/operator/services
      - /api/v1/operator/ratings
      - /api/v1/ratings/**
    filters:
      - RemoveResponseHeader=Access-Control-Allow-Origin
      - RemoveResponseHeader=Access-Control-Allow-Credentials
      - RemoveResponseHeader=Access-Control-Expose-Headers
  - id: payment-service
    uri: ${ROUTE_PAYMENT_URL:http://localhost:3005}
    predicates:
      - /api/v1/payments/**
      - /api/v1/payments
      - /api/v1/payment-accounts
      - /api/v1/admin/payments/**
      - /api/v1/admin/payments
      - /api/v1/admin/payment-accounts/**
      - /api/v1/admin/payment-accounts
      - /api/v1/admin/payment-methods
      - /api/v1/admin/promotions/**
      - /api/v1/admin/promotions
      - /api/v1/loyalty/**
      - /api/v1/loyalty
    filters:
      - RemoveResponseHeader=Access-Control-Allow-Origin
      - RemoveResponseHeader=Access-Control-Allow-Credentials
      - RemoveResponseHeader=Access-Control-Expose-Headers
  - id: notification-service
    uri: ${ROUTE_NOTIFICATION_URL:http://localhost:3006}
    predicates:
      - /api/v1/notifications/**
      - /api/v1/notifications
      - /api/v1/admin/notifications/**
      - /api/v1/admin/notifications
    filters:
