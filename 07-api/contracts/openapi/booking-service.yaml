# Contract of booking-service, rebuilt on 2026-10-23 from the code on origin/develop (see 07-api/README.md).
# Regenerate it from the code instead of editing by hand, so it never drifts.
openapi: 3.0.3
info:
  title: LavaRápido booking-service API
  version: v1
  description: |-
    Contract of booking-service, rebuilt from the controllers of `lavarapido-booking-service` on `origin/develop` (`38681b2`, 2026-10-23) and checked against them (`07-api/README.md`, "How the contracts are checked"). Paths, methods, parameters, bodies, success codes and roles are the ones in the code; the error codes of each operation were traced from the controller method through the use cases, domain and adapters it calls.

    **Security.** Operations without `security` use the bearer JWT (`bearerAuth`). `security: []` = public. `x-roles` = roles the service accepts on that path (from its `SecurityConfig`); `x-access` = `public`, `authenticated` (any role), `roles`, `internal` (only `X-Internal-Key`, not published by the gateway) or `roles + internal key`. Ownership checks (a client only sees its own data) answer 404, not 403.

    **Errors.** Every error is a `ProblemDetail` with `code`. Each error response lists its codes in `x-codes`. Catalogue of this service:

    | `code` | HTTP | Raised by / when |
    |---|---|---|
    | `BAD_REQUEST` | 400 | Spring MVC rejected the request before the controller: malformed JSON, missing required query parameter or wrong parameter type |
    | `BAY_NEW_IN_MAINTENANCE` | 400 | `InvalidValueException` — `POST /api/v1/admin/bays` |
    | `DATE_REQUIRED` | 400 | `InvalidValueException` — 5 operations (see `x-codes` of each response) |
    | `DUPLICATED_SERVICE` | 400 | `InvalidValueException` — 4 operations (see `x-codes` of each response) |
    | `DUPLICATED_VEHICLE_TYPE` | 400 | `InvalidValueException` — `POST /api/v1/admin/catalog/services`, `PUT /api/v1/admin/catalog/services/{id}` |
    | `ESTABLISHMENT_INVALID_EMAIL` | 400 | `InvalidValueException` — `PUT /api/v1/admin/establishment` |
    | `ESTABLISHMENT_INVALID_FOUNDATION_DATE` | 400 | `InvalidValueException` — `PUT /api/v1/admin/establishment` |
    | `ESTABLISHMENT_INVALID_PHONE` | 400 | `InvalidValueException` — `PUT /api/v1/admin/establishment` |
    | `ESTABLISHMENT_REQUIRED_FIELD` | 400 | `InvalidValueException` — `PUT /api/v1/admin/establishment` |
    | `INVALID_BAY_NAME` | 400 | `InvalidValueException` — `POST /api/v1/admin/bays`, `PUT /api/v1/admin/bays/{id}` |
    | `INVALID_BAY_STATUS` | 400 | `InvalidValueException` — `POST /api/v1/admin/bays`, `PUT /api/v1/admin/bays/{id}` |
    | `INVALID_BREAK` | 400 | `InvalidValueException` — 7 operations (see `x-codes` of each response) |
    | `INVALID_CANCELLATION_REASON` | 400 | `InvalidValueException` — `PATCH /api/v1/admin/bookings/{id}/status`, `POST /api/v1/bookings/{id}/cancel` |
    | `INVALID_CATEGORY` | 400 | `InvalidValueException` — `POST /api/v1/admin/catalog/services`, `PUT /api/v1/admin/catalog/services/{id}` |
    | `INVALID_DATE` | 400 | `InvalidValueException` — 9 operations (see `x-codes` of each response) |
    | `INVALID_DAY` | 400 | `InvalidValueException` — 7 operations (see `x-codes` of each response) |
    | `INVALID_DURATION` | 400 | `InvalidValueException` — `POST /api/v1/admin/catalog/services`, `PUT /api/v1/admin/catalog/services/{id}` |
    | `INVALID_HOURS` | 400 | `InvalidValueException` — 11 operations (see `x-codes` of each response) |
    | `INVALID_LOYALTY_POINTS` | 400 | `InvalidValueException` — `POST /api/v1/admin/catalog/services`, `PUT /api/v1/admin/catalog/services/{id}` |
    | `INVALID_NOTES` | 400 | `InvalidValueException` — 4 operations (see `x-codes` of each response) |
    | `INVALID_PRICE` | 400 | `InvalidValueException` — `POST /api/v1/admin/catalog/services`, `PUT /api/v1/admin/catalog/services/{id}` |
    | `INVALID_QUANTITY` | 400 | `InvalidValueException` — 4 operations (see `x-codes` of each response) |
    | `INVALID_RANGE` | 400 | `InvalidValueException` — 7 operations (see `x-codes` of each response) |
    | `INVALID_REASON` | 400 | `InvalidValueException` — 11 operations (see `x-codes` of each response) |
    | `INVALID_SERVICE_CODE` | 400 | `InvalidValueException` — `POST /api/v1/admin/catalog/services` |
    | `INVALID_SERVICE_NAME` | 400 | `InvalidValueException` — `POST /api/v1/admin/catalog/services`, `PUT /api/v1/admin/catalog/services/{id}` |
    | `INVALID_STATUS` | 400 | `InvalidValueException` — `GET /api/v1/admin/bookings`, `PATCH /api/v1/admin/bookings/{id}/status`, `PATCH /api/v1/operator/bookings/{id}/status` |
    | `INVALID_TOKEN` | 400 | `InvalidValueException` — 26 operations (see `x-codes` of each response) |
    | `INVALID_VEHICLE` | 400 | `InvalidValueException` — `POST /api/v1/admin/bookings`, `POST /api/v1/bookings` |
    | `INVALID_VEHICLE_TYPE` | 400 | `InvalidValueException` — `POST /api/v1/admin/catalog/services`, `PUT /api/v1/admin/catalog/services/{id}` |
    | `INVALID_WEEK` | 400 | `InvalidValueException` — `PUT /api/v1/admin/schedule/business-hours` |
    | `PRICES_REQUIRED` | 400 | `InvalidValueException` — `POST /api/v1/admin/catalog/services`, `PUT /api/v1/admin/catalog/services/{id}` |
    | `SERVICES_REQUIRED` | 400 | `InvalidValueException` — 5 operations (see `x-codes` of each response) |
    | `TIME_REQUIRED` | 400 | `InvalidValueException` — 4 operations (see `x-codes` of each response) |
    | `VALIDATION_ERROR` | 400 | Bean Validation failed on the body (`errors`: field → message) or, where the service maps it, a path/query parameter has the wrong type |
    | `VEHICLE_REQUIRED` | 400 | `InvalidValueException` — `POST /api/v1/admin/bookings`, `POST /api/v1/bookings` |
    | `UNAUTHORIZED` | 401 | No `Authorization: Bearer` token, invalid or expired token, closed session (the gateway checks it), or missing/wrong `X-Internal-Key` on `/internal/**` |
    | `FORBIDDEN` | 403 | The token is valid but its role is not allowed on this path |
    | `BAY_NOT_FOUND` | 404 | `NotFoundException` — `PUT /api/v1/admin/bays/{id}`, `DELETE /api/v1/admin/bays/{id}` |
    | `BOOKING_NOT_FOUND` | 404 | `NotFoundException` — 13 operations (see `x-codes` of each response) |
    | `ESTABLISHMENT_NOT_FOUND` | 404 | `NotFoundException` — `GET /api/v1/establishment`, `GET /api/v1/admin/establishment`, `PUT /api/v1/admin/establishment` |
    | `EXCEPTION_NOT_FOUND` | 404 | `NotFoundException` — `POST /api/v1/admin/schedule/exceptions`, `PUT /api/v1/admin/schedule/exceptions/{id}`, `DELETE /api/v1/admin/schedule/exceptions/{id}` |
    | `NOT_FOUND` | 404 | No route matches (Spring MVC) |
    | `SERVICE_NOT_FOUND` | 404 | `NotFoundException` — 9 operations (see `x-codes` of each response) |
    | `VEHICLE_NOT_FOUND` | 404 | `NotFoundException` — 4 operations (see `x-codes` of each response) |
    | `METHOD_NOT_ALLOWED` | 405 | The path exists but not with this HTTP method |
    | `BAY_HAS_BOOKINGS` | 409 | `ConflictException` — `DELETE /api/v1/admin/bays/{id}` |
    | `BAY_NAME_TAKEN` | 409 | `ConflictException` — `POST /api/v1/admin/bays`, `PUT /api/v1/admin/bays/{id}` |
    | `BOOKING_NOT_CHANGEABLE` | 409 | `ConflictException` — 4 operations (see `x-codes` of each response) |
    | `BOOKING_NOT_EXPIRED` | 409 | `ConflictException` — `POST /internal/v1/bookings/{id}/no-show` |
    | `CONFLICT` | 409 | The database rejected the change (unique index, trigger or check) after the code's own checks |
    | `EXCEPTION_DATE_TAKEN` | 409 | `ConflictException` — `POST /api/v1/admin/schedule/exceptions`, `PUT /api/v1/admin/schedule/exceptions/{id}` |
    | `INVALID_STATUS_TRANSITION` | 409 | `ConflictException` — `PATCH /api/v1/admin/bookings/{id}/status`, `POST /internal/v1/bookings/{id}/no-show`, `PATCH /api/v1/operator/bookings/{id}/status` |
    | `SCHEDULE_BUSY` | 409 | `ConflictException` — 5 operations (see `x-codes` of each response) |
    | `SERVICE_CODE_TAKEN` | 409 | `ConflictException` — `POST /api/v1/admin/catalog/services` |
    | `SERVICE_NOT_AVAILABLE_FOR_VEHICLE` | 409 | `ConflictException` — 5 operations (see `x-codes` of each response) |
    | `SERVICE_TOO_EARLY` | 409 | `ConflictException` — `PATCH /api/v1/operator/bookings/{id}/status` |
    | `SLOT_UNAVAILABLE` | 409 | `SlotUnavailableException` — 4 operations (see `x-codes` of each response) |
    | `VEHICLE_ALREADY_BOOKED` | 409 | `ConflictException` — 4 operations (see `x-codes` of each response) |
    | `INTERNAL_ERROR` | 500 | Unexpected error (logged with its correlation id) |
    | `CUSTOMER_SERVICE_UNAVAILABLE` | 503 | `DependencyUnavailableException` — 13 operations (see `x-codes` of each response) |
servers:
  - url: http://localhost:8080
    description: Through the API gateway (ADR-005); `/internal/**` is not reachable here
  - url: http://localhost:3003
    description: booking-service directly (local development and service-to-service calls)
