# Contract of notification-service, rebuilt on 2026-10-24 from the code on origin/develop (see 07-api/README.md).
# Regenerate it from the code instead of editing by hand, so it never drifts.
openapi: 3.0.3
info:
  title: LavaRápido notification-service API
  version: v1
  description: |-
    Contract of notification-service, rebuilt from the controllers of `lavarapido-notification-service` on `origin/develop` (`c5429ad`, 2026-10-24) and checked against them (`07-api/README.md`, "How the contracts are checked"). Paths, methods, parameters, bodies, success codes and roles are the ones in the code; the error codes of each operation were traced from the controller method through the use cases, domain and adapters it calls.

    **Security.** Operations without `security` use the bearer JWT (`bearerAuth`). `security: []` = public. `x-roles` = roles the service accepts on that path (from its `SecurityConfig`); `x-access` = `public`, `authenticated` (any role), `roles`, `internal` (only `X-Internal-Key`, not published by the gateway) or `roles + internal key`. Ownership checks (a client only sees its own data) answer 404, not 403.

    **Errors.** Every error is a `ProblemDetail` with `code`. Each error response lists its codes in `x-codes`. Catalogue of this service:

    | `code` | HTTP | Raised by / when |
    |---|---|---|
    | `BAD_REQUEST` | 400 | Spring MVC rejected the request before the controller: malformed JSON, missing required query parameter or wrong parameter type |
    | `INVALID_DATE_RANGE` | 400 | `InvalidValueException` — `GET /api/v1/notifications` |
    | `INVALID_DEVICE_TOKEN` | 400 | `InvalidValueException` — `PUT /api/v1/notifications/devices`, `POST /api/v1/notifications/devices/unregister` |
    | `INVALID_MESSAGE` | 400 | `InvalidValueException` — `POST /api/v1/admin/notifications`, `POST /internal/v1/notifications/app-update` |
    | `INVALID_PAGE` | 400 | `InvalidValueException` — `GET /api/v1/notifications` |
    | `INVALID_PLATFORM` | 400 | `InvalidValueException` — `PUT /api/v1/notifications/devices` |
    | `INVALID_RECIPIENT` | 400 | `InvalidValueException` — `POST /api/v1/admin/notifications`, `PUT /api/v1/notifications/devices`, `POST /internal/v1/notifications/app-update` |
    | `INVALID_REFERENCE` | 400 | `InvalidValueException` — `POST /api/v1/admin/notifications`, `POST /internal/v1/notifications/app-update` |
    | `INVALID_REMINDER` | 400 | `InvalidValueException` — not reached from HTTP (events or scheduled jobs) |
    | `INVALID_TITLE` | 400 | `InvalidValueException` — `POST /api/v1/admin/notifications`, `POST /internal/v1/notifications/app-update` |
    | `INVALID_TOKEN` | 400 | `InvalidValueException` — 8 operations (see `x-codes` of each response) |
    | `INVALID_VERSION` | 400 | `InvalidValueException` — `POST /internal/v1/notifications/app-update` |
    | `NOTIFICATION_TYPE_NOT_ALLOWED` | 400 | `NotificationTypeNotAllowedException` — `POST /api/v1/admin/notifications` |
    | `UNKNOWN_NOTIFICATION_TYPE` | 400 | `UnknownNotificationTypeException` — 6 operations (see `x-codes` of each response) |
    | `VALIDATION_ERROR` | 400 | Bean Validation failed on the body (`errors`: field → message) or, where the service maps it, a path/query parameter has the wrong type |
    | `UNAUTHORIZED` | 401 | No `Authorization: Bearer` token, invalid or expired token, closed session (the gateway checks it), or missing/wrong `X-Internal-Key` on `/internal/**` |
    | `FORBIDDEN` | 403 | The token is valid but its role is not allowed on this path |
    | `NOT_FOUND` | 404 | No route matches (Spring MVC) |
    | `NOTIFICATION_NOT_FOUND` | 404 | `NotificationNotFoundException` — `PATCH /api/v1/notifications/{id}/read`, `PATCH /api/v1/notifications/{id}/unread`, `DELETE /api/v1/notifications/{id}` |
    | `METHOD_NOT_ALLOWED` | 405 | The path exists but not with this HTTP method |
    | `CONFLICT` | 409 | The database rejected the change (unique index, trigger or check) after the code's own checks |
    | `INTERNAL_ERROR` | 500 | Unexpected error (logged with its correlation id) |
    | `SECURITY_SERVICE_UNAVAILABLE` | 503 | `DependencyUnavailableException` — not reached from HTTP (events or scheduled jobs) |
servers:
  - url: http://localhost:8080
    description: Through the API gateway (ADR-005); `/internal/**` is not reachable here
  - url: http://localhost:3006
    description: notification-service directly (local development and service-to-service calls)
security:
  - bearerAuth: []
