        "400":
          description: "Bad Request. `code`: `BAD_REQUEST`, `INVALID_MESSAGE`, `INVALID_RECIPIENT`, `INVALID_REFERENCE`, `INVALID_TITLE`, `NOTIFICATION_TYPE_NOT_ALLOWED`, `UNKNOWN_NOTIFICATION_TYPE`, `VALIDATION_ERROR`."
