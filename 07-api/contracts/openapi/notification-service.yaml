components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from `POST /api/v1/auth/login` (security-service, HS256, claims `sub`, `roles`, `sid`). Every service validates it itself (ADR-006); the gateway forwards it unchanged.
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: Shared key between services (`app.internal.api-key` / `INTERNAL_API_KEY`). Only for `/internal/**` (and, in booking-service, `/api/v1/operator/**`). These routes are not published by the API gateway.
  schemas:
    ProblemDetail:
      type: object
      description: "RFC 7807 problem detail returned by every error (`Content-Type: application/problem+json`). `code` is the stable value the web and the app translate; `detail` is an English message for logs."
      required:
        - status
        - code
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: The data conflicts with an existing record
        instance:
          type: string
          example: /api/v1/bookings
        code:
          type: string
          description: Error code (catalogue in `info.description` and `x-error-codes`)
          example: CONFLICT
        errors:
          type: object
          additionalProperties:
            type: string
          description: "Only with `VALIDATION_ERROR`: invalid field → message"
      additionalProperties: true
    AdminNotificationRequest:
      type: object
      properties:
        userIds:
          type: array
          items:
            type: integer
            format: int64
          minItems: 1
          maxItems: 100
        type:
          type: string
        title:
          type: string
          minLength: 1
          x-not-blank: true
          maxLength: 120
        message:
          type: string
          minLength: 1
          x-not-blank: true
          maxLength: 500
      required:
        - userIds
        - title
        - message
      description: "Mensaje que el administrador envía a uno o varios usuarios (los user_id salen de la lista de usuarios del security-service). type es opcional: por defecto SYSTEM_MESSAGE."
      x-java: com/lavarapido/notification/infrastructure/adapter/in/web/dto/AdminNotificationRequest.java:14
    AppUpdateRequest:
      type: object
      properties:
        versionCode:
          type: integer
          format: int32
          minimum: 0
          exclusiveMinimum: true
      required:
        - versionCode
      x-java: com/lavarapido/notification/infrastructure/adapter/in/web/InternalAppUpdateController.java:31
    AppUpdateResponse:
      type: object
      properties:
        versionCode:
          type: integer
          format: int32
        notified:
          type: integer
          format: int32
      description: "notified: a cuántos usuarios se les avisó (0 si esa versión ya se había anunciado)."
      x-java: com/lavarapido/notification/infrastructure/adapter/in/web/InternalAppUpdateController.java:36
    DeviceResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        platform:
          type: string
        active:
          type: boolean
        lastSeenAt:
          type: string
          format: date-time
      description: "El token no se devuelve completo: basta con saber que quedó registrado."
      x-java: com/lavarapido/notification/infrastructure/adapter/in/web/dto/DeviceRequests.java:27
    NotificationCategory:
      type: string
      enum:
        - REMINDER
        - PROMOTION
        - CONFIRMATION
        - CANCELLATION
        - MESSAGE
        - SYSTEM
    NotificationResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        category:
          type: string
        title:
          type: string
        message:
          type: string
        referenceEntity:
          type: string
        referenceId:
          type: integer
          format: int64
        read:
          type: boolean
        readAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
      description: Notificación como la recibe el frontend. type es el code estable (para traducir); category es la pestaña donde se muestra; reference* permite abrir la pantalla de la reserva o el pago.
      x-java: com/lavarapido/notification/infrastructure/adapter/in/web/dto/NotificationResponse.java:11
    PageResponseOfNotificationResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
      description: Misma forma de página que usa el security-service (items, page, size, totalElements, totalPages).
      x-java: com/lavarapido/notification/infrastructure/adapter/in/web/dto/PageResponse.java:8
    RegisterDeviceRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          x-not-blank: true
          maxLength: 200
        platform:
          type: string
          minLength: 1
          x-not-blank: true
      required:
        - token
        - platform
      description: "Lo manda la app al iniciar sesión: el token de Expo y si es Android o iOS."
      x-java: com/lavarapido/notification/infrastructure/adapter/in/web/dto/DeviceRequests.java:16
    UnregisterDeviceRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          x-not-blank: true
          maxLength: 200
      required:
        - token
      description: Lo manda la app al cerrar sesión, para dejar de recibir push en ese celular.
      x-java: com/lavarapido/notification/infrastructure/adapter/in/web/dto/DeviceRequests.java:22
