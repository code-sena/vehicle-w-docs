          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssignmentResponse"
        "400":
          description: "Bad Request. `code`: `BAD_REQUEST`, `INVALID_ASSIGNMENT_NOTES`, `INVALID_DAY`, `INVALID_RANGE`, `INVALID_REASON`, `INVALID_TOKEN`, `VALIDATION_ERROR`."
          x-codes:
