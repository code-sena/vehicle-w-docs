      tags:
        - "rating-controller"
      operationId: "mine"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/RatingResponse"
  "/api/v1/operator/services":
    get:
      tags:
        - "operator-controller"
      operationId: "services"
      parameters:
        - name: "from"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
        - name: "to"
          in: "query"
          required: false
          schema:
            type: "string"
