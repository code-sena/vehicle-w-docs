openapi: "3.1.0"
info:
  title: "LavaRápido operations-service API"
  version: "v1"
  description: "Contract of operations-service. Public paths are reached through the API gateway."
servers:
  - url: "http://localhost:8080"
    description: "Through the API gateway (ADR-005)"
  - url: "http://localhost:3004"
    description: "operations-service directly (local development)"
paths:
  "/api/v1/admin/operators/{id}/availability":
    put:
      tags:
        - "admin-operations-controller"
      operationId: "setAvailability"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
      requestBody:
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AvailabilityRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/OperatorResponse"
  "/api/v1/admin/assignments/{bookingId}":
    put:
      tags:
        - "admin-operations-controller"
      operationId: "assign"
      parameters:
        - name: "bookingId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AssignRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/AssignmentResponse"
        "409":
          description: "BOOKING_NOT_ASSIGNABLE (already started, finished or cancelled), BOOKING_IN_PAST (its time has passed) or the AssignmentPolicy reason: OPERATOR_INACTIVE, OPERATOR_NOT_ON_SHIFT, OPERATOR_ABSENT, OPERATOR_BUSY"
  "/api/v1/ratings/{bookingId}":
    post:
      tags:
        - "rating-controller"
      operationId: "rate"
      parameters:
        - name: "bookingId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RatingRequest"
        required: true
      responses:
        "201":
          description: "Created"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/RatingResponse"
  "/api/v1/operator/services/{bookingId}/start":
    post:
      tags:
        - "operator-controller"
      operationId: "start"
      parameters:
        - name: "bookingId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/OperatorServiceResponse"
        "409":
          description: "SERVICE_TOO_EARLY (more than 15 minutes before the booking), OPERATOR_BUSY (another service in progress) or EXECUTION_ALREADY_STARTED"
  "/api/v1/operator/services/{bookingId}/finish":
    post:
      tags:
        - "operator-controller"
      operationId: "finish"
      parameters:
        - name: "bookingId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/OperatorServiceResponse"
  "/api/v1/admin/operators/{id}/absences":
    get:
      tags:
        - "admin-operations-controller"
      operationId: "absences"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
        - name: "from"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
        - name: "to"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/AbsenceResponse"
    post:
      tags:
        - "admin-operations-controller"
      operationId: "addAbsence"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
      requestBody:
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AbsenceRequest"
        required: true
      responses:
        "201":
          description: "Created"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/AbsenceResponse"
  "/api/v1/admin/operators/{id}/status":
