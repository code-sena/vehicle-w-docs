# Generated from the running operations-service (springdoc, GET /v3/api-docs) on 2026-10-06.
# Do not edit by hand: regenerate from the code so the contract never drifts.
openapi: "3.1.0"
info:
  title: "LavaRápido operations-service API"
  version: "v1"
  description: "Contract of operations-service. Public paths are reached through the API gateway."
servers:
  - url: "http://localhost:8080"
    description: "Through the API gateway (ADR-005)"
  - url: "http://localhost:3004"
    description: "operations-service directly (local development)"
paths:
  "/api/v1/admin/operators/{id}/availability":
    put:
      tags:
        - "admin-operations-controller"
      operationId: "setAvailability"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
      requestBody:
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AvailabilityRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/OperatorResponse"
  "/api/v1/admin/assignments/{bookingId}":
    put:
      tags:
        - "admin-operations-controller"
      operationId: "assign"
      parameters:
        - name: "bookingId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AssignRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/AssignmentResponse"
        "409":
          description: "BOOKING_NOT_ASSIGNABLE (already started, finished or cancelled), BOOKING_IN_PAST (its time has passed) or the AssignmentPolicy reason: OPERATOR_INACTIVE, OPERATOR_NOT_ON_SHIFT, OPERATOR_ABSENT, OPERATOR_BUSY"
  "/api/v1/ratings/{bookingId}":
    post:
      tags:
        - "rating-controller"
      operationId: "rate"
      parameters:
        - name: "bookingId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/RatingRequest"
        required: true
      responses:
        "201":
          description: "Created"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/RatingResponse"
  "/api/v1/operator/services/{bookingId}/start":
    post:
      tags:
        - "operator-controller"
      operationId: "start"
      parameters:
        - name: "bookingId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/OperatorServiceResponse"
        "409":
          description: "SERVICE_TOO_EARLY (more than 15 minutes before the booking), OPERATOR_BUSY (another service in progress) or EXECUTION_ALREADY_STARTED"
  "/api/v1/operator/services/{bookingId}/finish":
    post:
      tags:
        - "operator-controller"
      operationId: "finish"
      parameters:
        - name: "bookingId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/OperatorServiceResponse"
  "/api/v1/admin/operators/{id}/absences":
    get:
      tags:
        - "admin-operations-controller"
      operationId: "absences"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
        - name: "from"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
        - name: "to"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/AbsenceResponse"
    post:
      tags:
        - "admin-operations-controller"
      operationId: "addAbsence"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
      requestBody:
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/AbsenceRequest"
        required: true
      responses:
        "201":
          description: "Created"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/AbsenceResponse"
  "/api/v1/admin/operators/{id}/status":
    patch:
      tags:
        - "admin-operations-controller"
      operationId: "setActive"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
      requestBody:
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ActiveRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/OperatorResponse"
  "/api/v1/admin/operators/summary":
    get:
      tags:
        - "admin-operations-controller"
      operationId: "teamSummary"
      description: "Summary of the operators team for the admin list. Null values mean there is no data to compute them."
      parameters:
        - name: "week"
          in: "query"
          required: false
          description: "Any date of the week to compute; default is the current week."
          schema:
            type: "string"
            format: "date"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/TeamSummaryResponse"
  "/api/v1/admin/operators/{id}/metrics":
    get:
      tags:
        - "admin-operations-controller"
      operationId: "metrics"
      description: "Weekly metrics of the operator (Monday to Sunday). Null values mean there is no data to compute them."
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
        - name: "week"
          in: "query"
          required: false
          description: "Any date of the week to compute; default is the current week."
          schema:
            type: "string"
            format: "date"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/OperatorMetricsResponse"
  "/api/v1/admin/inspections/{bookingId}":
    get:
      tags:
        - "inspection-controllers"
      operationId: "inspection"
      description: "Whether the booking allows a report, whether it can be edited, and the report (null if not started)."
      parameters:
        - name: "bookingId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/InspectionResponse"
    post:
      tags:
        - "inspection-controllers"
      operationId: "startInspection"
      description: "Starts the report (409 INSPECTION_NOT_EDITABLE unless the booking is 180+ minutes and confirmed or in progress). Starting twice returns the same report."
      parameters:
        - name: "bookingId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/InspectionResponse"
  "/api/v1/admin/inspections/{bookingId}/phases/{phase}":
    patch:
      tags:
        - "inspection-controllers"
      operationId: "setPhaseStatus"
      parameters:
        - name: "bookingId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
        - name: "phase"
          in: "path"
          required: true
          schema:
            type: "string"
            enum: ["RECEPTION", "EXTERIOR", "INTERIOR", "ENGINE", "DELIVERY"]
      requestBody:
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                status:
                  type: "string"
                  enum: ["PENDING", "IN_PROGRESS", "DONE"]
        required: true
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/InspectionResponse"
  "/api/v1/admin/inspections/{bookingId}/findings":
    post:
      tags:
        - "inspection-controllers"
      operationId: "addFinding"
      description: "400 INVALID_FINDING, TOO_MANY_PHOTOS (more than 5) or INVALID_PHOTO (not JPEG/PNG or over 2 MB); 413 CONTENT_TOO_LARGE when the upload exceeds the limits."
      parameters:
        - name: "bookingId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        content:
          "multipart/form-data":
            schema:
              type: "object"
              properties:
                phase:
                  type: "string"
                area:
                  type: "string"
                severity:
                  type: "string"
                  enum: ["INFO", "MINOR", "MAJOR"]
                note:
                  type: "string"
                photos:
                  type: "array"
                  items:
                    type: "string"
                    format: "binary"
              required: ["phase", "area", "severity"]
        required: true
      responses:
        "201":
          description: "Created"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/InspectionResponse"
  "/api/v1/admin/inspections/{bookingId}/findings/{findingId}":
    delete:
      tags:
        - "inspection-controllers"
      operationId: "removeFinding"
      parameters:
        - name: "bookingId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
        - name: "findingId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/InspectionResponse"
  "/api/v1/admin/inspections/{bookingId}/publish":
    post:
      tags:
        - "inspection-controllers"
      operationId: "publishInspection"
      parameters:
        - name: "bookingId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/InspectionResponse"
  "/api/v1/admin/inspections/{bookingId}/share":
    post:
      tags:
        - "inspection-controllers"
      operationId: "shareInspection"
      description: "Publishes InspectionShared; notification-service notifies the client with the summary and the public link. 409 INSPECTION_NOT_PUBLISHED."
      parameters:
        - name: "bookingId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "204":
          description: "No Content"
  "/api/v1/admin/inspections/{bookingId}/photos/{photoId}":
    get:
      tags:
        - "inspection-controllers"
      operationId: "inspectionPhoto"
      parameters:
        - name: "bookingId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
        - name: "photoId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "The image (image/jpeg or image/png)"
  "/api/v1/public/inspections/{token}":
    get:
      tags:
        - "inspection-controllers"
      operationId: "publicInspection"
      description: "No session. 404 INSPECTION_NOT_FOUND when the token does not exist or the report is not published."
      security: []
      parameters:
        - name: "token"
          in: "path"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/PublicReportResponse"
  "/api/v1/public/inspections/{token}/photos/{photoId}":
    get:
      tags:
        - "inspection-controllers"
      operationId: "publicInspectionPhoto"
      security: []
      parameters:
        - name: "token"
          in: "path"
          required: true
          schema:
            type: "string"
        - name: "photoId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "The image, only if it belongs to that published report"
  "/api/v1/ratings/me":
    get:
      tags:
        - "rating-controller"
      operationId: "mine"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/RatingResponse"
  "/api/v1/operator/services":
    get:
      tags:
        - "operator-controller"
      operationId: "services"
      parameters:
        - name: "from"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
        - name: "to"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/OperatorServiceResponse"
        "404":
          description: "OPERATOR_NOT_FOUND: the token belongs to an account that security-service says does not exist, so no operator row is created."
  "/api/v1/operator/ratings":
    get:
      tags:
        - "operator-controller"
      operationId: "ratings"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/RatingResponse"
  "/api/v1/operators/available":
    get:
      tags:
        - "available-operators-controller"
      operationId: "availableOperators"
      description: "RF-010: operators free for the slot (active, on shift, not absent, not busy), first name and rating only."
      parameters:
        - name: "date"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "date"
        - name: "time"
          in: "query"
          required: true
          description: "HH:mm"
          schema:
            type: "string"
        - name: "minutes"
          in: "query"
          required: true
          schema:
            type: "integer"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                type: "array"
                items:
                  type: "object"
                  properties:
                    operatorId:
                      type: "integer"
                    firstName:
                      type: "string"
                    averageRating:
                      type: "number"
                      nullable: true
                    ratingsCount:
                      type: "integer"
  "/api/v1/operators/my-bookings":
    get:
      tags:
        - "client-booking-operator-controller"
      operationId: "myBookingOperators"
      description: "CLIENT only: first name of the operator of each of the caller's bookings that already has one."
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                type: "array"
                items:
                  type: "object"
                  properties:
                    bookingId:
                      type: "integer"
                      format: "int64"
                    operatorName:
                      type: "string"
  "/api/v1/admin/operators/profiles":
    get:
      tags:
        - "operator-profile-controller"
      operationId: "operatorProfiles"
      description: "Specialty and skills of every operator; operators without a profile come empty."
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/OperatorProfile"
  "/api/v1/admin/operators/{id}/profile":
    put:
      tags:
        - "operator-profile-controller"
      operationId: "updateOperatorProfile"
      description: "Replaces the specialty and the whole list of skills (at most 10, unique names)."
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
      requestBody:
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                specialty:
                  type: "string"
                  maxLength: 80
                skills:
                  type: "array"
                  maxItems: 10
                  items:
                    "$ref": "#/components/schemas/OperatorSkill"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                "$ref": "#/components/schemas/OperatorProfile"
        "400":
          description: "INVALID_OPERATOR_PROFILE"
        "404":
          description: "OPERATOR_NOT_FOUND"
  "/api/v1/admin/operators":
    get:
      tags:
        - "admin-operations-controller"
      operationId: "operators"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/OperatorResponse"
  "/api/v1/admin/assignments":
    get:
      tags:
        - "admin-operations-controller"
      operationId: "assignments"
      parameters:
        - name: "from"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
        - name: "to"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/AssignmentResponse"
  "/api/v1/admin/assignments/{bookingId}/candidates":
    get:
      tags:
        - "admin-operations-controller"
      operationId: "candidates"
      parameters:
        - name: "bookingId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            "*/*":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/CandidateResponse"
  "/api/v1/admin/operators/{id}/absences/{absenceId}":
    delete:
      tags:
        - "admin-operations-controller"
      operationId: "removeAbsence"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
        - name: "absenceId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
      responses:
        "204":
          description: "No Content"
components:
  schemas:
    OperatorSkill:
      type: "object"
      properties:
        name:
          type: "string"
          maxLength: 60
        level:
          type: "string"
          enum: ["CERTIFIED", "EXPERT", "ADVANCED"]
    OperatorProfile:
      type: "object"
      properties:
        operatorId:
          type: "integer"
        specialty:
          type: "string"
          nullable: true
        skills:
          type: "array"
          items:
            "$ref": "#/components/schemas/OperatorSkill"
    AvailabilityRequest:
      type: "object"
      properties:
        week:
          type: "array"
          items:
            "$ref": "#/components/schemas/ShiftRequest"
      required:
        - "week"
    ShiftRequest:
      type: "object"
      properties:
        dayOfWeek:
          type: "integer"
          format: "int32"
          maximum: 7
          minimum: 1
        startsAt:
          type: "string"
        endsAt:
          type: "string"
      required:
        - "dayOfWeek"
        - "endsAt"
        - "startsAt"
    OperatorMetricsResponse:
      type: "object"
      properties:
        weekStart:
          type: "string"
          format: "date"
        weekEnd:
          type: "string"
          format: "date"
        completedServices:
          type: "integer"
          format: "int32"
        previousWeekServices:
          type: "integer"
          format: "int32"
        servicesTrendPercent:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Change against the previous week; null when the previous week had 0."
        punctualityPercent:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Bookings started at most 10 minutes late; null when none was started."
        punctualityLevel:
          type: "string"
          enum:
            - "EXCELLENT"
            - "GOOD"
            - "NEEDS_IMPROVEMENT"
            - "NO_DATA"
        revenue:
          type: "number"
        workedHours:
          type: "number"
          format: "double"
        availableHours:
          type: "number"
          format: "double"
        occupancyPercent:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Worked hours over the hours of the weekly shift; null without a shift."
    TeamSummaryResponse:
      type: "object"
      properties:
        weekStart:
          type: "string"
          format: "date"
        weekEnd:
          type: "string"
          format: "date"
        totalOperators:
          type: "integer"
          format: "int32"
        activeOperators:
          type: "integer"
          format: "int32"
        availableToday:
          type: "integer"
          format: "int32"
          description: "Active, on shift today and with no absence touching the day."
        absentToday:
          type: "integer"
          format: "int32"
        completedServices:
          type: "integer"
          format: "int32"
        previousWeekServices:
          type: "integer"
          format: "int32"
        servicesTrendPercent:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Change against the previous week; null when the previous week had 0."
        averageRating:
          type: "number"
          format: "double"
          nullable: true
          description: "Weighted by the number of ratings; null when there is none."
        ratingsCount:
          type: "integer"
          format: "int32"
    InspectionPhoto:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        url:
          type: "string"
          description: "Path relative to /api/v1"
    InspectionFinding:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        phase:
          type: "string"
        area:
          type: "string"
        severity:
          type: "string"
        note:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
        photos:
          type: "array"
          items:
            "$ref": "#/components/schemas/InspectionPhoto"
    InspectionPhase:
      type: "object"
      properties:
        phase:
          type: "string"
        status:
          type: "string"
        startedAt:
          type: "string"
          format: "date-time"
        finishedAt:
          type: "string"
          format: "date-time"
        findings:
          type: "array"
          items:
            "$ref": "#/components/schemas/InspectionFinding"
    InspectionSummary:
      type: "object"
      properties:
        phasesDone:
          type: "integer"
        phasesTotal:
          type: "integer"
        findings:
          type: "integer"
        majorFindings:
          type: "integer"
        progressPercent:
          type: "integer"
    InspectionResponse:
      type: "object"
      properties:
        available:
          type: "boolean"
        editable:
          type: "boolean"
        report:
          type: "object"
          nullable: true
          properties:
            bookingId:
              type: "integer"
              format: "int64"
            booking:
              type: "object"
              properties:
                code:
                  type: "string"
                vehicle:
                  type: "string"
                plate:
