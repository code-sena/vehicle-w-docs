components:
  schemas:
    AvailabilityRequest:
      type: "object"
      properties:
        week:
          type: "array"
          items:
            "$ref": "#/components/schemas/ShiftRequest"
      required:
        - "week"
    ShiftRequest:
      type: "object"
      properties:
        dayOfWeek:
          type: "integer"
          format: "int32"
          maximum: 7
          minimum: 1
        startsAt:
          type: "string"
        endsAt:
          type: "string"
      required:
        - "dayOfWeek"
        - "endsAt"
        - "startsAt"
    OperatorResponse:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        userId:
          type: "integer"
          format: "int64"
        fullName:
          type: "string"
        email:
          type: "string"
        phone:
          type: "string"
        active:
          type: "boolean"
        hiredOn:
          type: "string"
          format: "date"
        week:
          type: "array"
          items:
            "$ref": "#/components/schemas/ShiftResponse"
        completedServices:
          type: "integer"
          format: "int32"
        averageRating:
          type: "number"
          format: "double"
        ratingsCount:
          type: "integer"
          format: "int32"
    ShiftResponse:
      type: "object"
      properties:
        dayOfWeek:
          type: "integer"
          format: "int32"
        startsAt:
          type: "string"
        endsAt:
          type: "string"
    AssignRequest:
      type: "object"
      properties:
        operatorId:
          type: "integer"
          format: "int32"
      required:
        - "operatorId"
    AssignmentResponse:
      type: "object"
      properties:
        bookingId:
          type: "integer"
          format: "int64"
        operatorId:
          type: "integer"
          format: "int32"
        operatorName:
          type: "string"
        status:
          type: "string"
    RatingRequest:
      type: "object"
      properties:
        rating:
          type: "integer"
          format: "int32"
          maximum: 5
          minimum: 1
        comment:
          type: "string"
          maxLength: 500
          minLength: 0
      required:
        - "rating"
    RatingResponse:
      type: "object"
      properties:
        bookingId:
          type: "integer"
          format: "int64"
        bookingCode:
          type: "string"
        date:
          type: "string"
          format: "date"
        services:
          type: "string"
        vehicle:
          type: "string"
        plate:
          type: "string"
        rating:
          type: "integer"
          format: "int32"
        comment:
          type: "string"
        ratedAt:
          type: "string"
          format: "date-time"
        operatorName:
          type: "string"
          description: "First name of the operator who washed the vehicle (what the client sees). Empty if security-service could not be read."
        clientName:
          type: "string"
          description: "First name of the client (what the operator sees next to the plate). Empty if security-service could not be read."
    OperatorServiceResponse:
      type: "object"
      properties:
        bookingId:
          type: "integer"
          format: "int64"
        code:
          type: "string"
        bookingStatus:
          type: "string"
        date:
          type: "string"
          format: "date"
        startTime:
          type: "string"
        endTime:
          type: "string"
        services:
          type: "string"
        vehicle:
          type: "string"
        plate:
          type: "string"
        total:
          type: "number"
        status:
          type: "string"
        startedAt:
          type: "string"
          format: "date-time"
        finishedAt:
          type: "string"
          format: "date-time"
        rating:
          type: "integer"
          format: "int32"
        comment:
          type: "string"
        startableAt:
          type: "string"
          format: "date-time"
          description: "First instant the operator can start the service: 15 minutes before the booking (StartPolicy, ADR-014 §6). The screens enable Start with it."
    AbsenceRequest:
      type: "object"
      properties:
        startsAt:
          type: "string"
          format: "date-time"
        endsAt:
          type: "string"
          format: "date-time"
        reason:
          type: "string"
          maxLength: 120
          minLength: 0
      required:
        - "endsAt"
        - "reason"
        - "startsAt"
    AbsenceResponse:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
        startsAt:
          type: "string"
          format: "date-time"
        endsAt:
          type: "string"
          format: "date-time"
        reason:
          type: "string"
    ActiveRequest:
      type: "object"
      properties:
        active:
          type: "boolean"
      required:
        - "active"
    CandidateResponse:
      type: "object"
      properties:
        operatorId:
          type: "integer"
          format: "int32"
        fullName:
          type: "string"
        averageRating:
          type: "number"
          format: "double"
        ratingsCount:
          type: "integer"
          format: "int32"
        assigned:
          type: "boolean"
        available:
          type: "boolean"
        unavailableReason:
          type: "string"
