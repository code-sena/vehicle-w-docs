  /api/v1/admin/assignments/{bookingId}:
    put:
      tags:
        - Admin Operations
      operationId: assign
      description: |-
        Assigns (or reassigns) the operator of every line of the booking. `notes` (B-01, optional, up to 300 characters) are the administrator's indications for the operator, stored in `service_execution.assignment_notes`; reassigning without notes clears them. They are not returned to the operator yet (`OperatorServiceResponse` has no notes field). An operator whose security account is disabled answers 409 `OPERATOR_ACCOUNT_DISABLED` (A-13).

        Javadoc: Asigna (o cambia) el operario de una reserva (RF-008/009).
      x-access: roles
      x-roles:
        - ADMIN
      x-source: com/lavarapido/operations/infrastructure/adapter/in/web/OperationsControllers.java:111
