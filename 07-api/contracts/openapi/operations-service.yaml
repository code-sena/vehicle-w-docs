# Contract of operations-service, rebuilt on 2026-10-23 from the code on origin/develop (see 07-api/README.md).
# Regenerate it from the code instead of editing by hand, so it never drifts.
openapi: 3.0.3
info:
  title: LavaRápido operations-service API
  version: v1
  description: |-
    Contract of operations-service, rebuilt from the controllers of `lavarapido-operations-service` on `origin/develop` (`71df4b2`, 2026-10-23) and checked against them (`07-api/README.md`, "How the contracts are checked"). Paths, methods, parameters, bodies, success codes and roles are the ones in the code; the error codes of each operation were traced from the controller method through the use cases, domain and adapters it calls.

    **Security.** Operations without `security` use the bearer JWT (`bearerAuth`). `security: []` = public. `x-roles` = roles the service accepts on that path (from its `SecurityConfig`); `x-access` = `public`, `authenticated` (any role), `roles`, `internal` (only `X-Internal-Key`, not published by the gateway) or `roles + internal key`. Ownership checks (a client only sees its own data) answer 404, not 403.

    **Errors.** Every error is a `ProblemDetail` with `code`. Each error response lists its codes in `x-codes`. Catalogue of this service:

    | `code` | HTTP | Raised by / when |
    |---|---|---|
    | `ABSENCE_IN_PAST` | 400 | `InvalidValueException` — `POST /api/v1/admin/operators/{id}/absences` |
    | `BAD_REQUEST` | 400 | Spring MVC rejected the request before the controller: malformed JSON, missing required query parameter or wrong parameter type |
    | `BOOKING_WITHOUT_CLIENT` | 400 | `InvalidValueException` — `POST /api/v1/admin/inspections/{bookingId}/share` |
    | `COMMENT_TOO_LONG` | 400 | `InvalidValueException` — not reached from HTTP (events or scheduled jobs) |
    | `DUPLICATED_DAY` | 400 | `InvalidValueException` — `PUT /api/v1/admin/operators/{id}/availability` |
    | `INVALID_ASSIGNMENT_NOTES` | 400 | `InvalidValueException` — `PUT /api/v1/admin/assignments/{bookingId}` |
    | `INVALID_DAY` | 400 | `InvalidValueException` — 8 operations (see `x-codes` of each response) |
    | `INVALID_FINDING` | 400 | `InvalidValueException` — `POST /api/v1/admin/inspections/{bookingId}/findings` |
    | `INVALID_OPERATOR_PROFILE` | 400 | `InvalidValueException` — `PUT /api/v1/admin/operators/{id}/profile` |
    | `INVALID_PHOTO` | 400 | `InvalidValueException` — `POST /api/v1/admin/inspections/{bookingId}/findings` |
    | `INVALID_RANGE` | 400 | `InvalidValueException` — 20 operations (see `x-codes` of each response) |
    | `INVALID_RATING` | 400 | `InvalidValueException` — not reached from HTTP (events or scheduled jobs) |
    | `INVALID_REASON` | 400 | `InvalidValueException` — 20 operations (see `x-codes` of each response) |
    | `INVALID_SLOT` | 400 | `InvalidValueException` — `GET /api/v1/operators/available` |
    | `INVALID_TOKEN` | 400 | `InvalidValueException` — 22 operations (see `x-codes` of each response) |
    | `TOO_MANY_PHOTOS` | 400 | `InvalidValueException` — `POST /api/v1/admin/inspections/{bookingId}/findings` |
    | `VALIDATION_ERROR` | 400 | Bean Validation failed on the body (`errors`: field → message) or, where the service maps it, a path/query parameter has the wrong type |
    | `UNAUTHORIZED` | 401 | No `Authorization: Bearer` token, invalid or expired token, closed session (the gateway checks it), or missing/wrong `X-Internal-Key` on `/internal/**` |
    | `FORBIDDEN` | 403 | The token is valid but its role is not allowed on this path |
    | `ABSENCE_NOT_FOUND` | 404 | `NotFoundException` — `DELETE /api/v1/admin/operators/{id}/absences/{absenceId}` |
    | `BOOKING_NOT_FOUND` | 404 | `NotFoundException` — 15 operations (see `x-codes` of each response) |
    | `FINDING_NOT_FOUND` | 404 | `NotFoundException` — `DELETE /api/v1/admin/inspections/{bookingId}/findings/{findingId}` |
    | `INSPECTION_NOT_FOUND` | 404 | `NotFoundException` — 10 operations (see `x-codes` of each response) |
    | `NOT_FOUND` | 404 | No route matches (Spring MVC) |
    | `OPERATOR_NOT_FOUND` | 404 | `NotFoundException` — 12 operations (see `x-codes` of each response) |
    | `PHOTO_NOT_FOUND` | 404 | `NotFoundException` — `GET /api/v1/admin/inspections/{bookingId}/photos/{photoId}`, `GET /api/v1/public/inspections/{token}/photos/{photoId}` |
    | `METHOD_NOT_ALLOWED` | 405 | The path exists but not with this HTTP method |
    | `ABSENCE_OVERLAP` | 409 | `ConflictException` — `POST /api/v1/admin/operators/{id}/absences` |
    | `ALREADY_RATED` | 409 | `ConflictException` — not reached from HTTP (events or scheduled jobs) |
    | `ASSIGNMENT_BUSY` | 409 | `ConflictException` — `PUT /api/v1/admin/assignments/{bookingId}` |
    | `BOOKING_IN_PAST` | 409 | `ConflictException` — `PUT /api/v1/admin/assignments/{bookingId}` |
    | `BOOKING_NOT_ASSIGNABLE` | 409 | `ConflictException` — `PUT /api/v1/admin/assignments/{bookingId}`, `GET /api/v1/admin/assignments/{bookingId}/candidates` |
    | `BOOKING_NOT_TO_CLOSE` | 409 | `ConflictException` — `POST /api/v1/admin/assignments/{bookingId}/attended` |
    | `BOOKING_STATE_CONFLICT` | 409 | `ConflictException` — `POST /api/v1/admin/assignments/{bookingId}/attended`, `POST /api/v1/operator/services/{bookingId}/start`, `POST /api/v1/operator/services/{bookingId}/finish` |
    | `CONFLICT` | 409 | The database rejected the change (unique index, trigger or check) after the code's own checks |
    | `EXECUTION_ALREADY_COMPLETED` | 409 | `ConflictException` — `POST /api/v1/admin/assignments/{bookingId}/attended` |
    | `EXECUTION_ALREADY_STARTED` | 409 | `ConflictException` — `PUT /api/v1/admin/assignments/{bookingId}` |
    | `EXECUTION_NOT_STARTED` | 409 | `ConflictException` — not reached from HTTP (events or scheduled jobs) |
    | `INSPECTION_NOT_EDITABLE` | 409 | `ConflictException` — 7 operations (see `x-codes` of each response) |
    | `INSPECTION_NOT_PUBLISHED` | 409 | `ConflictException` — `POST /api/v1/admin/inspections/{bookingId}/share` |
    | `OPERATOR_ABSENT` | 409 | `ConflictException` — `PUT /api/v1/admin/assignments/{bookingId}` |
    | `OPERATOR_ACCOUNT_DISABLED` | 409 | `ConflictException` — `PUT /api/v1/admin/assignments/{bookingId}` |
    | `OPERATOR_BUSY` | 409 | `ConflictException` — `PUT /api/v1/admin/assignments/{bookingId}`, `POST /api/v1/operator/services/{bookingId}/start` |
    | `OPERATOR_INACTIVE` | 409 | `ConflictException` — 5 operations (see `x-codes` of each response) |
    | `OPERATOR_NOT_ON_SHIFT` | 409 | `ConflictException` — `PUT /api/v1/admin/assignments/{bookingId}` |
    | `SERVICE_NOT_COMPLETED` | 409 | `ConflictException` — `POST /api/v1/ratings/{bookingId}` |
    | `SERVICE_TOO_EARLY` | 409 | `ConflictException` — `POST /api/v1/operator/services/{bookingId}/start` |
    | `INTERNAL_ERROR` | 500 | Unexpected error (logged with its correlation id) |
    | `BOOKING_SERVICE_UNAVAILABLE` | 503 | `DependencyUnavailableException` — 25 operations (see `x-codes` of each response) |
servers:
  - url: http://localhost:8080
    description: Through the API gateway (ADR-005); `/internal/**` is not reachable here
  - url: http://localhost:3004
    description: operations-service directly (local development and service-to-service calls)
